function bytesToBase64(bytes) {
  let binary = "";
  const stride = 0x8000;
  for (let i = 0; i < bytes.length; i += stride) binary += String.fromCharCode(...bytes.subarray(i, i + stride));
  return btoa(binary);
}

function base64ToBytes(text) {
  const binary = atob(text);
  const out = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) out[i] = binary.charCodeAt(i);
  return out;
}

async function sendPlcMessage(message) {
  if (!plcWriter) throw new Error("PLC is not connected.");
  const line = JSON.stringify(message) + "\n";
  await plcWriter.write(new TextEncoder().encode(line));
}

function waitForPlcMessage(predicate, timeoutMs = 10000) {
  return new Promise((resolve, reject) => {
    const waiter = { predicate, resolve, reject, timer: null };
    waiter.timer = setTimeout(() => {
      plcMessageWaiters = plcMessageWaiters.filter(item => item !== waiter);
      reject(new Error("Timed out waiting for PLC response."));
    }, timeoutMs);
    plcMessageWaiters.push(waiter);
  });
}

function dispatchPlcMessage(message) {
  if (!message || typeof message !== "object") return;
  if (message.type === "LIVE_SNAPSHOT") applyLiveSnapshot(message);

  if (message.type === "PROJECT_SOURCE_BEGIN") {
    const pendingResolve = incomingProjectSource?.resolve || null;
    const pendingReject = incomingProjectSource?.reject || null;
    incomingProjectSource = {
      chunks: [],
      expectedCRC: message.transferCRC ?? message.crc ?? null,
      resolve: pendingResolve,
      reject: pendingReject
    };
  } else if (message.type === "PROJECT_SOURCE_CHUNK" && incomingProjectSource) {
    incomingProjectSource.chunks[Number(message.seq) || 0] = base64ToBytes(message.data || "");
  } else if (message.type === "PROJECT_SOURCE_END" && incomingProjectSource) {
    try {
      const length = incomingProjectSource.chunks.reduce((n, c) => n + (c?.length || 0), 0);
      const bytes = new Uint8Array(length);
      let offset = 0;
      incomingProjectSource.chunks.forEach(chunk => { if (chunk) { bytes.set(chunk, offset); offset += chunk.length; } });
      const text = new TextDecoder().decode(bytes);
      const actual = crc32Text(text);
      if (incomingProjectSource.expectedCRC != null && actual !== Number(incomingProjectSource.expectedCRC)) throw new Error("Stored project source CRC mismatch.");
      incomingProjectSource.resolve?.(text);
    } catch (error) { incomingProjectSource.reject?.(error); }
  }

  const matched = [];
  plcMessageWaiters.forEach(waiter => {
    let ok = false;
    try { ok = !!waiter.predicate(message); } catch (_) {}
    if (ok) matched.push(waiter);
  });
  matched.forEach(waiter => {
    clearTimeout(waiter.timer);
    plcMessageWaiters = plcMessageWaiters.filter(item => item !== waiter);
    waiter.resolve(message);
  });
}

async function serialReadLoop() {
  while (plcPort?.readable && plcConnected) {
    plcReader = plcPort.readable.getReader();
    try {
      while (plcConnected) {
        const { value, done } = await plcReader.read();
        if (done) break;
        plcReadBuffer += new TextDecoder().decode(value, { stream: true });
        let newline;
        while ((newline = plcReadBuffer.indexOf("\n")) >= 0) {
          const line = plcReadBuffer.slice(0, newline).trim();
          plcReadBuffer = plcReadBuffer.slice(newline + 1);
          if (!line) continue;
          try { dispatchPlcMessage(JSON.parse(line)); } catch (error) { console.warn("Ignoring malformed PLC message", line, error); }
        }
      }
    } catch (error) {
      if (plcConnected) console.error("PLC serial read failed:", error);
    } finally {
      try { plcReader.releaseLock(); } catch (_) {}
      plcReader = null;
    }
    break;
  }
  if (plcConnected) disconnectPlc("PLC disconnected");
}

async function disconnectPlc(detail = "Disconnected") {
  plcConnected = false;
  try { await plcWriter?.close?.(); } catch (_) {}
  try { plcWriter?.releaseLock?.(); } catch (_) {}
  plcWriter = null;
  try { await plcPort?.close?.(); } catch (_) {}
  plcPort = null;
  connectPlcButton.textContent = "Connect PLC";
  setPlcState("DISCONNECTED", detail);
}

async function requestRunningProjectSource(statusMessage) {
  const sourcePromise = new Promise((resolve, reject) => {
    incomingProjectSource = { chunks: [], expectedCRC: null, resolve, reject };
  });
  await sendPlcMessage({ cmd: "GET_PROJECT_SOURCE" });
  const text = await Promise.race([
    sourcePromise,
    new Promise((_, reject) => setTimeout(() => reject(new Error("Timed out retrieving the running project source.")), 15000))
  ]);
  const project = JSON.parse(text);
  if (project?.format === "PICO_PLC_PROJECT" && project.project?.sourceCRC != null) {
    const canonical = JSON.parse(JSON.stringify(project));
    const expectedSourceCRC = Number(canonical.project.sourceCRC);
    delete canonical.project.sourceCRC;
    delete canonical.project.configCRC;
    delete canonical.project.optimizedCRC;
    const actualSourceCRC = crc32Text(JSON.stringify(canonical));
    if (actualSourceCRC !== expectedSourceCRC) throw new Error("Authoritative project source checksum failed.");
  }
  loadProgramIntoEditor(project);
  currentFileHandle = null;
  syncProjectIdentityUi();
}

async function connectPlc() {
  if (plcConnected) { await disconnectPlc(); return; }
  if (!("serial" in navigator)) {
    alert("This browser does not provide the Web Serial API required for direct PLC USB communication.");
    return;
  }
  try {
    setPlcState("CONNECTING", "Connecting…");
    plcPort = await navigator.serial.requestPort();
    await plcPort.open({ baudRate: 115200 });
    plcWriter = plcPort.writable.getWriter();
    plcConnected = true;
    connectPlcButton.textContent = "Disconnect PLC";
    serialReadLoop();
    await sendPlcMessage({ cmd: "GET_STATUS" });
    const status = await waitForPlcMessage(msg => msg.type === "STATUS" || msg.plcState, 5000);
    const state = status.plcState || status.state || "READY_FOR_PROGRAM";
    if (state === "RUNNING") {
      setPlcState("RUNNING", `${status.projectTitle || "PLC"} r${status.revision || "?"} — Running`);
      try { await requestRunningProjectSource(status); } catch (error) { console.warn("Unable to retrieve running project source:", error); }
      await sendPlcMessage({ cmd: "SUBSCRIBE_LIVE", enabled: true });
    } else {
      setPlcState("READY_FOR_PROGRAM", "Offline — Ready for Program");
    }
  } catch (error) {
    console.error("Unable to connect to PLC:", error);
    await disconnectPlc("Connection failed");
    if (error?.name !== "NotFoundError") alert(error.message || "Unable to connect to the PLC.");
  }
}

async function sendFlashObject(kind, text, crc, progressStart, progressEnd) {
  const bytes = new TextEncoder().encode(text);
  const total = Math.max(1, Math.ceil(bytes.length / PLC_TRANSFER_CHUNK_BYTES));
  await sendPlcMessage({ cmd: `${kind}_BEGIN`, bytes: bytes.length, chunks: total, crc });
  for (let seq = 0; seq < total; seq++) {
    const start = seq * PLC_TRANSFER_CHUNK_BYTES;
    const chunk = bytes.subarray(start, Math.min(bytes.length, start + PLC_TRANSFER_CHUNK_BYTES));
    await sendPlcMessage({ cmd: `${kind}_CHUNK`, seq, data: bytesToBase64(chunk) });
    const pct = progressStart + ((seq + 1) / total) * (progressEnd - progressStart);
    setTransferStage(pct, `Sending ${kind === "SOURCE" ? "authoritative project source" : "optimized program"}…`);
    const ack = await waitForPlcMessage(msg => msg.type === "ACK" && msg.section === kind && Number(msg.seq) === seq, 10000);
    if (ack.status === "ERROR") throw new Error(ack.message || `${kind} chunk ${seq} rejected.`);
  }
  await sendPlcMessage({ cmd: `${kind}_END` });
  const result = await waitForPlcMessage(msg => msg.stage === kind && ["OK", "ERROR"].includes(msg.status), 15000);
  if (result.status !== "OK") throw new Error(result.message || `${kind} verification failed.`);
}

async function recoverAfterProgrammingError(originalError) {
  showTransferError(originalError?.message || "PLC programming failed.");
  plcRunStopButton.disabled = true;
  try {
    await sendPlcMessage({ cmd: "STOP_RESET_FLUSH" });
    appendTransferInfo("PLC recovery requested");
    await waitForPlcMessage(msg => msg.plcState === "READY_FOR_PROGRAM", 15000);
    appendTransferInfo("PLC stopped, reset and flushed — ready for program", "ok");
    setPlcState("READY_FOR_PROGRAM", "Offline — Ready for Program");
    plcRunStopButton.disabled = false;
  } catch (recoveryError) {
    setPlcState("ERROR", "Recovery not confirmed");
    transferErrorBox.textContent += `\nRecovery confirmation failed: ${recoveryError.message}`;
  }
}

async function uploadLogicAndRun() {
  if (!plcConnected || plcState !== "READY_FOR_PROGRAM") return;
  plcRunStopButton.disabled = true;
  openTransferModal();
  try {
    setTransferStage(3, "Requesting programming mode…");
    await sendPlcMessage({ cmd: "PROGRAM_REQUEST" });
    await waitForPlcMessage(msg => msg.plcState === "READY_FOR_PROGRAM", 10000);
    setTransferStage(10, "PLC ready for program", "PLC stopped, reset and program RAM flushed");

    setTransferStage(14, "Building authoritative and optimized project data…");
    const artifacts = buildTransferArtifacts();
    appendTransferInfo(`Project ${currentProgramName} r${currentProgramRevision} prepared`, "ok");

    await sendPlcMessage({ cmd: "PROJECT_METADATA", project: artifacts.verbose.project });
    setTransferStage(18, "Project metadata sent", "Project metadata accepted for transfer");

    await sendFlashObject("SOURCE", artifacts.verboseText, artifacts.sourceTransferCRC, 18, 45);
    setTransferStage(45, "Authoritative source verified", "Verbose project source stored and verified in flash");

    await sendFlashObject("OPTIMIZED", artifacts.optimizedText, artifacts.optimizedTransferCRC, 45, 72);
    setTransferStage(72, "Optimized program verified", "Optimized program stored and verified in flash");

    await sendPlcMessage({ cmd: "BUILD_RUNTIME_FROM_FLASH" });
    setTransferStage(78, "Reading optimized program from flash and compiling runtime…");
    let result = await waitForPlcMessage(msg => msg.stage === "COMPILE" && ["OK", "ERROR"].includes(msg.status), 20000);
    if (result.status !== "OK") throw new Error(result.message || "Runtime compilation failed.");
    setTransferStage(87, "Runtime compiled", "Runtime program compiled from flash");

    result = await waitForPlcMessage(msg => msg.stage === "VALIDATE" && ["OK", "ERROR"].includes(msg.status), 15000);
    if (result.status !== "OK") throw new Error(result.message || "PLC runtime validation failed.");
    setTransferStage(94, "Program validated", "Configuration, references and checksums validated");

    await sendPlcMessage({ cmd: "RUN" });
    result = await waitForPlcMessage(msg => msg.plcState === "RUNNING", 15000);
    setPlcState("RUNNING", `${currentProgramName} r${currentProgramRevision} — Running`);
    await sendPlcMessage({ cmd: "SUBSCRIBE_LIVE", enabled: true });
    completeTransferModal();
    plcRunStopButton.disabled = false;
  } catch (error) {
    console.error("PLC programming failed:", error);
    await recoverAfterProgrammingError(error);
  }
}

async function stopAndFlushPlc() {
  if (!plcConnected || plcState !== "RUNNING") return;
  plcRunStopButton.disabled = true;
  try {
    await sendPlcMessage({ cmd: "SUBSCRIBE_LIVE", enabled: false });
    await sendPlcMessage({ cmd: "STOP_RESET_FLUSH" });
    await waitForPlcMessage(msg => msg.plcState === "READY_FOR_PROGRAM", 15000);
    setPlcState("READY_FOR_PROGRAM", "Offline — Ready for Program");
    plcRunStopButton.disabled = false;
  } catch (error) {
    console.error("Unable to stop/flush PLC:", error);
    setPlcState("ERROR", "Stop/flush not confirmed");
    alert(error.message || "The PLC did not confirm Stop/Flush.");
  }
}

async function saveProgram(saveAs = false) {
  const text = jsonTextForCurrentProgram();

  try {
    if ("showSaveFilePicker" in window) {
      if (saveAs || !currentFileHandle) {
        currentFileHandle = await window.showSaveFilePicker({
          suggestedName: normalizeJsonFilename(currentProgramName),
          types: [{
            description: "Pico PLC Ladder Program",
            accept: { "application/json": [".json"] }
          }]
        });
        currentProgramName = currentFileHandle.name.replace(/\.json$/i, "") || currentProgramName;
        syncProjectIdentityUi();
      }

      // Rebuild after naming so program.name follows Save As.
      await saveWithHandle(currentFileHandle, jsonTextForCurrentProgram());
      return;
    }

    // Browser fallback: Save and Save As both create a normal JSON download.
    downloadJsonFallback(currentProgramName, text);
  } catch (error) {
    if (error?.name !== "AbortError") {
      console.error("Unable to save ladder program:", error);
      alert("Unable to save the ladder program.");
    }
  }
}

async function openProgram() {
  try {
    if ("showOpenFilePicker" in window) {
      const [handle] = await window.showOpenFilePicker({
        multiple: false,
        types: [{
          description: "Pico PLC Ladder Program",
          accept: { "application/json": [".json"] }
        }]
      });

      const file = await handle.getFile();
      const program = JSON.parse(await file.text());
      loadProgramIntoEditor(program);
      currentFileHandle = handle;
      currentProgramName = program?.project?.title || file.name.replace(/\.json$/i, "") || currentProgramName;
      syncProjectIdentityUi();
      return;
    }

    // Fallback for browsers without the File System Access API.
    const input = document.createElement("input");
    input.type = "file";
    input.accept = ".json,application/json";
    input.style.display = "none";
    document.body.appendChild(input);

    input.addEventListener("change", async () => {
      const file = input.files?.[0];
      input.remove();
      if (!file) return;

      try {
        const program = JSON.parse(await file.text());
        loadProgramIntoEditor(program);
        currentFileHandle = null;
        currentProgramName = program?.project?.title || file.name.replace(/\.json$/i, "") || currentProgramName;
        syncProjectIdentityUi();
      } catch (error) {
        console.error("Unable to open ladder program:", error);
        alert(error.message || "Unable to open the ladder program.");
      }
    }, { once: true });

    input.click();
  } catch (error) {
    if (error?.name !== "AbortError") {
      console.error("Unable to open ladder program:", error);
      alert(error.message || "Unable to open the ladder program.");
    }
  }
}

ladderCanvas.addEventListener("dblclick", event => {
  if (!editorEnabled) return;

  // Edit by major-cell occupancy rather than by clicking the rendered image.
  // This makes double-click editing reliable even when the graphic itself has
  // pointer-events disabled or its visible artwork occupies only part of the cell.
  const cell = getCellFromMouse(event);
  if (!cell) return;

  const tile = getTilesOccupyingCell(cell.col, cell.row).find(candidate => {
    const type = getProgramTypeFromTile(candidate);
    return type && type !== "vertical_shunt" && type !== "horizontal_shunt";
  });
  if (!tile) return;

  event.preventDefault();
  event.stopPropagation();
  editPlacedElement(tile).catch(error => {
    console.error("Unable to edit ladder element:", error);
    alert(error.message || "Unable to edit this ladder element.");
  });
});

  placementMode = definition.key;
  placementDefinition = definition;

  placementPreview.src = placementImage;

  if (definition.spanRows > 1 && definition.overlay !== true) {

}


function eventToCanvasPoint(event) {
  const rect = ladderCanvas.getBoundingClientRect();
  return {
    x: event.clientX - rect.left,
    y: event.clientY - rect.top
  };
}

function pointToMajorCell(point) {
  return {
    col: Math.floor(point.x / majorCellSize),
    row: Math.floor(point.y / majorCellSize)
  };
}

function setSelectionMarquee(left, top, width, height, invalid = false) {
  selectionMarquee.style.left = left + "px";
  selectionMarquee.style.top = top + "px";
  selectionMarquee.style.width = width + "px";
  selectionMarquee.style.height = height + "px";
  selectionMarquee.style.display = "block";
  selectionMarquee.classList.toggle("invalid", invalid);
}

function hideSelectionMarquee() {
  selectionMarquee.style.display = "none";
  selectionMarquee.classList.remove("invalid");
}


function removeGroupGhosts() {
  groupGhosts.forEach(item => item.ghost.remove());
  groupGhosts = [];
}

function cancelGroupMove() {
  removeGroupGhosts();
  selectedGroup = [];
  selectedOriginalPositions = [];
  groupSelectionBounds = null;
  groupMoveAnchor = null;
  groupPointerOffsetPx = { x: 0, y: 0 };
  groupSnapTarget = null;
  groupMoveActive = false;
  groupMoveValid = false;
  marqueeSelecting = false;
  hideSelectionMarquee();
}

function getTileMajorBounds(tile) {
  const col = parseInt(tile.dataset.majorColumn || "0", 10);
  const row = parseInt(tile.dataset.majorRow || "0", 10);
  const spanRows = parseInt(tile.dataset.spanRows || "1", 10);
  return { left: col, right: col, top: row, bottom: row + spanRows - 1 };
}

function computeGroupBounds(tiles) {
  if (!tiles.length) return null;
  let left = Infinity, right = -Infinity, top = Infinity, bottom = -Infinity;

  tiles.forEach(tile => {
    const b = getTileMajorBounds(tile);
    left = Math.min(left, b.left);
    right = Math.max(right, b.right);
    top = Math.min(top, b.top);
    bottom = Math.max(bottom, b.bottom);
  });

  return { left, right, top, bottom };
}

function getTilesIntersectingSelectionRect() {
  const left = parseFloat(selectionMarquee.style.left) || 0;
  const top = parseFloat(selectionMarquee.style.top) || 0;
  const right = left + (parseFloat(selectionMarquee.style.width) || 0);
  const bottom = top + (parseFloat(selectionMarquee.style.height) || 0);

  return [...ladderCanvas.querySelectorAll(".placed-tile")].filter(tile => {
    const tileLeft = tile.offsetLeft;
    const tileTop = tile.offsetTop;
    const tileRight = tileLeft + tile.offsetWidth;
    const tileBottom = tileTop + tile.offsetHeight;

    return tileRight >= left &&
           tileLeft <= right &&
           tileBottom >= top &&
           tileTop <= bottom;
  });
}

function createGroupGhosts() {
  removeGroupGhosts();

  groupGhosts = selectedOriginalPositions.map(original => {
    const ghost = original.tile.cloneNode(true);
    ghost.classList.remove("placed-tile", "vertical-shunt", "group-selected");
    ghost.classList.add("group-move-ghost");

    // Ghosts are visual only: they do not participate in save, occupancy,
    // deletion, or normal ladder-block queries.
    ghost.removeAttribute("id");
    ghost.style.left = (original.col * majorCellSize) + "px";
    ghost.style.top = original.tile.style.top;
    ghost.style.zIndex = "2400";

    ladderCanvas.appendChild(ghost);
    return { ghost, original };
  });
}


function beginGroupMoveFromSelection(releasePoint) {
  const tiles = getTilesIntersectingSelectionRect();
  if (!tiles.length) {
    hideSelectionMarquee();
    return;
  }

  selectedGroup = tiles;
  selectedOriginalPositions = selectedGroup.map(tile => ({
    tile,
    col: parseInt(tile.dataset.majorColumn || "0", 10),
    row: parseInt(tile.dataset.majorRow || "0", 10)
  }));

  groupSelectionBounds = computeGroupBounds(selectedGroup);

  // The mouse cell becomes the placement anchor after selection, so no
  // selection-release offset is used for drop validation.
  groupPointerOffsetPx = { x: 0, y: 0 };

  groupMoveAnchor = {
    col: groupSelectionBounds.left,
    row: groupSelectionBounds.top
  };

  groupMoveActive = true;
  createGroupGhosts();
  hideSelectionMarquee();

  // Render immediately at mouse-up and slightly offset the visual copies so
  // they are unmistakably separate from the unchanged originals.
  updateGroupMovePreviewFromPointer(releasePoint);
}

function selectionContainsTile(tile) {
  return selectedGroup.includes(tile);
}

function rectanglesOverlap(a, b) {
  return !(
    a.right <= b.left ||
    a.left >= b.right ||
    a.bottom <= b.top ||
    a.top >= b.bottom
  );
}

function getPlacedTileRect(tile) {
  return {
    left: tile.offsetLeft,
    top: tile.offsetTop,
    right: tile.offsetLeft + tile.offsetWidth,
    bottom: tile.offsetTop + tile.offsetHeight
  };
}

function getPlannedTileRect(original, deltaCol, deltaRow) {
  const tile = original.tile;
  const definition = placeableDefinitions[tile.dataset.blockType];
  const topOffset = definition?.topOffset || 0;

  const newCol = original.col + deltaCol;
  const newRow = original.row + deltaRow;
  const left = newCol * majorCellSize;
  const top = newRow * majorCellSize + topOffset;

  // Native image dimensions are authoritative in v1.3+.
  const width = tile.naturalWidth || tile.offsetWidth;
  const height = tile.naturalHeight || tile.offsetHeight;

  return {
    left,
    top,
    right: left + width,
    bottom: top + height
  };
}

function ghostImagesRemainOnGrid() {
  const canvasWidth = ladderCanvas.offsetWidth;
  const canvasHeight = ladderCanvas.offsetHeight;

  return groupGhosts.every(({ ghost }) => {
    const left = ghost.offsetLeft;
    const top = ghost.offsetTop;
    const right = left + ghost.offsetWidth;
    const bottom = top + ghost.offsetHeight;

    return (
      left >= 0 &&
      top >= 0 &&
      right <= canvasWidth &&
      bottom <= canvasHeight
    );
  });
}

function destinationAllowsGroup(deltaCol, deltaRow) {
  if (!groupSelectionBounds) return false;

  const canvasWidth = ladderCanvas.offsetWidth;
  const canvasHeight = ladderCanvas.offsetHeight;
  const allTiles = [...ladderCanvas.querySelectorAll(".placed-tile")];

  for (const original of selectedOriginalPositions) {
    const tile = original.tile;
    const planned = getPlannedTileRect(original, deltaCol, deltaRow);

    // Exact native image rectangle must remain completely on the ladder canvas.
    if (
      planned.left < 0 ||
      planned.top < 0 ||
      planned.right > canvasWidth ||
      planned.bottom > canvasHeight
    ) {
      return false;
    }

    // Vertical shunts and other overlays are permitted to overlap normal blocks.
    if (tile.dataset.overlay === "true") {
      continue;
    }

    for (const other of allTiles) {
      // The source tiles being moved do not block their own move.
      if (selectionContainsTile(other)) continue;

      // Existing overlays do not block ordinary blocks.
      if (other.dataset.overlay === "true") continue;

      const otherRect = getPlacedTileRect(other);

      if (rectanglesOverlap(planned, otherRect)) {
        return false;
      }
    }
  }

  return true;
}

function getSnappedGroupTarget(pointerPoint) {
  if (!groupSelectionBounds) return null;

  // The pointer is associated with the center of the leftmost major cell
  // of the group. Convert the pointer position to the major cell whose
  // center is currently under the mouse.
  const targetLeftCol = Math.floor(pointerPoint.x / majorCellSize);
  const targetTopRow = Math.floor(pointerPoint.y / majorCellSize);

  return {
    leftCol: targetLeftCol,
    topRow: targetTopRow,
    deltaCol: targetLeftCol - groupSelectionBounds.left,
    deltaRow: targetTopRow - groupSelectionBounds.top
  };
}

function updateGroupMovePreviewFromPointer(pointerPoint) {
  if (!groupMoveActive || !groupSelectionBounds) return;

  // The ghost group follows the mouse smoothly with the pointer anchored
  // at the center of the leftmost major cell of the selection.
  const visualGroupLeft =
    pointerPoint.x - (majorCellSize / 2) + groupGhostVisualOffsetPx.x;
  const visualGroupTop =
    pointerPoint.y - (majorCellSize / 2) + groupGhostVisualOffsetPx.y;

  const originalGroupLeft = groupSelectionBounds.left * majorCellSize;
  const originalGroupTop = groupSelectionBounds.top * majorCellSize;

  groupGhosts.forEach(({ ghost, original }) => {
    const originalLeft = original.col * majorCellSize;
    const definition = placeableDefinitions[original.tile.dataset.blockType];
    const topOffset = definition?.topOffset || 0;
    const originalTop = original.row * majorCellSize + topOffset;

    const relativeX = originalLeft - originalGroupLeft;
    const relativeY = originalTop - originalGroupTop;

    ghost.style.left = (visualGroupLeft + relativeX) + "px";
    ghost.style.top = (visualGroupTop + relativeY) + "px";
  });

  groupSnapTarget = getSnappedGroupTarget(pointerPoint);
  if (!groupSnapTarget) {
    groupMoveValid = false;
    return;
  }

  // Yellow means both the snapped destination and the visible ghost copies
  // are completely legal. Red means a planned block overlaps an existing
  // non-selected block, a planned block would leave the grid, or any currently
  // visible ghost image crosses the ladder canvas boundary.
  const snappedDestinationValid = destinationAllowsGroup(
    groupSnapTarget.deltaCol,
    groupSnapTarget.deltaRow
  );

  // The ghost copies move continuously with the pointer. They are invalid
  // whenever any visible portion crosses the ladder canvas edge, even if the
  // currently snapped major-cell destination would otherwise be legal.
  const ghostBoundsValid = ghostImagesRemainOnGrid();

  groupMoveValid = snappedDestinationValid && ghostBoundsValid;

  groupGhosts.forEach(({ ghost }) => {
    ghost.classList.toggle("invalid", !groupMoveValid);
  });

  // Marquee shows the exact snapped destination while the ghosts themselves
  // continue to follow the pointer smoothly.
  const width =
    (groupSelectionBounds.right - groupSelectionBounds.left + 1) * majorCellSize;
  const height =
    (groupSelectionBounds.bottom - groupSelectionBounds.top + 1) * majorCellSize;

  setSelectionMarquee(
    groupSnapTarget.leftCol * majorCellSize,
    groupSnapTarget.topRow * majorCellSize,
    width,
    height,
    !groupMoveValid
  );
}


function commitGroupCopy() {
  if (!groupMoveActive || !groupMoveValid || !groupSnapTarget) return false;

  const deltaCol = groupSnapTarget.deltaCol;
  const deltaRow = groupSnapTarget.deltaRow;

  const newTiles = [];

  selectedOriginalPositions.forEach(original => {
    const source = original.tile;
    const newCol = original.col + deltaCol;
    const newRow = original.row + deltaRow;
    const definition = placeableDefinitions[source.dataset.blockType];
    const topOffset = definition?.topOffset || 0;

    const placed = source.cloneNode(true);
    placed.classList.remove("group-selected");
    placed.dataset.blockId = String(nextBlockId++);
    placed.dataset.majorColumn = String(newCol);
    placed.dataset.majorRow = String(newRow);
    placed.style.left = (newCol * majorCellSize) + "px";
    placed.style.top = (newRow * majorCellSize + topOffset) + "px";

    ladderCanvas.appendChild(placed);
    newTiles.push(placed);
  });

  removeGroupGhosts();
  selectedGroup = [];
  selectedOriginalPositions = [];
  groupSelectionBounds = null;
  groupMoveAnchor = null;
  groupSnapTarget = null;
  groupMoveActive = false;
  groupMoveValid = false;
  hideSelectionMarquee();

  bringVerticalShuntsToFront();
  return true;
}

function commitGroupMove() {
  if (!groupMoveActive || !groupMoveValid || !groupSnapTarget) return false;

  const deltaCol = groupSnapTarget.deltaCol;
  const deltaRow = groupSnapTarget.deltaRow;

  // Convert the visual copies into the new real blocks, preserving all
  // serialized block metadata and persistent IDs.
  const committedTiles = [];

  groupGhosts.forEach(({ ghost, original }) => {
    const source = original.tile;
    const newCol = original.col + deltaCol;
    const newRow = original.row + deltaRow;
    const definition = placeableDefinitions[source.dataset.blockType];
    const topOffset = definition?.topOffset || 0;

    const placed = source.cloneNode(true);
    placed.classList.remove("group-selected");
    placed.style.left = (newCol * majorCellSize) + "px";
    placed.style.top = (newRow * majorCellSize + topOffset) + "px";
    placed.dataset.majorColumn = String(newCol);
    placed.dataset.majorRow = String(newRow);

    source.remove();
    ghost.remove();
    ladderCanvas.appendChild(placed);
    committedTiles.push(placed);
  });

  groupGhosts = [];
  selectedGroup = [];
  selectedOriginalPositions = [];
  groupSelectionBounds = null;
  groupMoveAnchor = null;
  groupSnapTarget = null;
  groupMoveActive = false;
  groupMoveValid = false;
  hideSelectionMarquee();

  bringVerticalShuntsToFront();
  return true;
}


function beginDeleteMarquee(event) {
  if (!editorEnabled || !deleteMode || placementDefinition || groupMoveActive) return;
  if (event.button !== 0) return;

  const point = eventToCanvasPoint(event);
  if (
    point.x < 0 ||
    point.y < 0 ||
    point.x >= ladderCanvas.offsetWidth ||
    point.y >= ladderCanvas.offsetHeight
  ) {
    return;
  }

  deleteMarqueeSelecting = true;
  deleteMarqueeStart = point;
  deleteMarqueeEnd = point;

  selectionMarquee.classList.add("delete-mode");
  setSelectionMarquee(point.x, point.y, 0, 0, false);
}

function updateDeleteMarquee(event) {
  if (!deleteMarqueeSelecting) return;

  const point = eventToCanvasPoint(event);
  deleteMarqueeEnd = {
    x: Math.max(0, Math.min(ladderCanvas.offsetWidth, point.x)),
    y: Math.max(0, Math.min(ladderCanvas.offsetHeight, point.y))
  };

  const left = Math.min(deleteMarqueeStart.x, deleteMarqueeEnd.x);
  const top = Math.min(deleteMarqueeStart.y, deleteMarqueeEnd.y);
  const width = Math.abs(deleteMarqueeEnd.x - deleteMarqueeStart.x);
  const height = Math.abs(deleteMarqueeEnd.y - deleteMarqueeStart.y);

  selectionMarquee.classList.add("delete-mode");
  setSelectionMarquee(left, top, width, height, false);
}

function getTilesIntersectingCurrentMarquee() {
  const left = parseFloat(selectionMarquee.style.left) || 0;
  const top = parseFloat(selectionMarquee.style.top) || 0;
  const right = left + (parseFloat(selectionMarquee.style.width) || 0);
  const bottom = top + (parseFloat(selectionMarquee.style.height) || 0);

  return [...ladderCanvas.querySelectorAll(".placed-tile")].filter(tile => {
    const tileLeft = tile.offsetLeft;
    const tileTop = tile.offsetTop;
    const tileRight = tileLeft + tile.offsetWidth;
    const tileBottom = tileTop + tile.offsetHeight;

    return !(
      tileRight < left ||
      tileLeft > right ||
      tileBottom < top ||
      tileTop > bottom
    );
  });
}

function finishDeleteMarquee(event) {
  if (!deleteMarqueeSelecting) return;

  updateDeleteMarquee(event);
  deleteMarqueeSelecting = false;

  const width = parseFloat(selectionMarquee.style.width) || 0;
  const height = parseFloat(selectionMarquee.style.height) || 0;

  // Preserve existing single-click delete behavior.
  if (width < 8 && height < 8) {
    selectionMarquee.classList.remove("delete-mode");
    hideSelectionMarquee();
    return;
  }

  const tilesToDelete = getTilesIntersectingCurrentMarquee();
  tilesToDelete.forEach(tile => tile.remove());

  suppressNextWorkspaceClick = true;
  selectionMarquee.classList.remove("delete-mode");
  hideSelectionMarquee();
  hideCellHighlight();
}

function cancelDeleteMarquee() {
  deleteMarqueeSelecting = false;
  deleteMarqueeStart = null;
  deleteMarqueeEnd = null;
  selectionMarquee.classList.remove("delete-mode");
  hideSelectionMarquee();
}

function beginMarqueeSelection(event) {
  if (!editorEnabled || placementDefinition || deleteMode || groupMoveActive || deleteMarqueeSelecting) return;
  if (event.button !== 0) return;

  const point = eventToCanvasPoint(event);
  if (point.x < 0 || point.y < 0 ||
      point.x >= ladderCanvas.offsetWidth ||
      point.y >= ladderCanvas.offsetHeight) {
    return;
  }

  marqueeSelecting = true;
  marqueeStart = point;
  marqueeEnd = point;
  setSelectionMarquee(point.x, point.y, 0, 0, false);
}

function updateMarqueeDrag(event) {
  if (!marqueeSelecting) return;

  const point = eventToCanvasPoint(event);
  marqueeEnd = {
    x: Math.max(0, Math.min(ladderCanvas.offsetWidth, point.x)),
    y: Math.max(0, Math.min(ladderCanvas.offsetHeight, point.y))
  };

  const left = Math.min(marqueeStart.x, marqueeEnd.x);
  const top = Math.min(marqueeStart.y, marqueeEnd.y);
  const width = Math.abs(marqueeEnd.x - marqueeStart.x);
  const height = Math.abs(marqueeEnd.y - marqueeStart.y);

  setSelectionMarquee(left, top, width, height, false);
}

function finishMarqueeDrag(event) {
  if (!marqueeSelecting) return;

  updateMarqueeDrag(event);
  marqueeSelecting = false;

  const width = parseFloat(selectionMarquee.style.width) || 0;
  const height = parseFloat(selectionMarquee.style.height) || 0;

  if (width < 8 && height < 8) {
    hideSelectionMarquee();
    return;
  }

  suppressNextWorkspaceClick = true;

  const releasePoint = eventToCanvasPoint(event);
  beginGroupMoveFromSelection(releasePoint);
}

function getTileOccupiedCells(tile) {
  const col = parseInt(tile.dataset.majorColumn || "0", 10);
  const row = parseInt(tile.dataset.majorRow || "0", 10);
  const spanRows = parseInt(tile.dataset.spanRows || "1", 10);
  const cells = [];

  for (let r = 0; r < spanRows; r++) {
    cells.push({ col, row: row + r });
  }

  return cells;
}

function getTilesOccupyingCell(col, row) {
  const tiles = [...ladderCanvas.querySelectorAll(".placed-tile")];

  return tiles.filter(tile => {
    const occupied = getTileOccupiedCells(tile);
    return occupied.some(cell => cell.col === col && cell.row === row);
  });
}

function getTileOccupyingCell(col, row) {
  const tiles = getTilesOccupyingCell(col, row);
  if (!tiles.length) return null;

  // Prefer an overlay such as Vertical Shunt when deleting/selecting.
  return tiles.find(tile => tile.dataset.overlay === "true") || tiles[0];
}

function getBlockingTileOccupyingCell(col, row) {
  // Overlay elements such as Vertical Shunt do not make a cell unavailable
  // for placement of ordinary ladder blocks.
  const tiles = getTilesOccupyingCell(col, row);
  return tiles.find(tile => tile.dataset.overlay !== "true") || null;
}

function cellContainsTimerOrCounter(col, row) {
  const tiles = getTilesOccupyingCell(col, row);
  return tiles.some(tile =>
    tile.dataset.blockType === "Timer" ||
    tile.dataset.blockType === "Counter"
  );
}

function removeTileOccupyingCell(col, row) {
  const tile = getTileOccupyingCell(col, row);
  if (tile) tile.remove();
}

function removeBlockingTileOccupyingCell(col, row) {
  const tile = getBlockingTileOccupyingCell(col, row);
  if (tile) tile.remove();
}

function getCellFromMouse(event) {
  const rect = ladderCanvas.getBoundingClientRect();
  const x = event.clientX - rect.left;
  const y = event.clientY - rect.top;

  if (x < 0 || y < 0 || x >= ladderCanvas.offsetWidth || y >= ladderCanvas.offsetHeight) {
    return null;
  }

  const col = Math.floor(x / majorCellSize);
  const row = Math.floor(y / majorCellSize);

  if (col < 0 || col >= 9 || row < 0 || row >= majorRows) return null;
  return { col, row };
}

function hideCellHighlight() {
  cellHighlight.classList.remove("green", "red");
  cellHighlight.style.display = "none";
}

function showCellHighlight(col, row, mode) {
  cellHighlight.style.left = (col * majorCellSize) + "px";
  cellHighlight.style.top = (row * majorCellSize) + "px";
  cellHighlight.style.width = majorCellSize + "px";
  cellHighlight.style.height = majorCellSize + "px";
  cellHighlight.classList.remove("green", "red");
  cellHighlight.classList.add(mode);
  cellHighlight.style.display = "block";
}

function updateHighlightForHoveredCell() {
  if (marqueeSelecting || groupMoveActive || deleteMarqueeSelecting) {
    hideCellHighlight();
    return;
  }
  if (!editorEnabled || !hoveredCell) {
    hideCellHighlight();
    return;
  }

  const { col, row } = hoveredCell;
  const occupiedTile = getTileOccupyingCell(col, row);
  const blockingTile = getBlockingTileOccupyingCell(col, row);

  if (deleteMode) {
    if (occupiedTile) {
      showCellHighlight(col, row, "red");
    } else {
      hideCellHighlight();
    }
    return;
  }

  // Vertical Shunt is an overlay and may be added even when the two cells
  // already contain contacts, coils, counters, or other regular elements.
  if (placementDefinition && placementDefinition.key === "vertical_shunt") {
    if (row + 1 < majorRows) {
      showCellHighlight(col, row, "green");
    } else {
      hideCellHighlight();
    }
    return;
  }

  // Other blocks require no blocking block in the clicked cell.
  // Vertical Shunts are overlays and do not block placement.
  if (!blockingTile) {
    if (placementDefinition && placementDefinition.spanRows > 1) {
      if (row + placementDefinition.spanRows - 1 >= majorRows) {
        hideCellHighlight();
        return;
      }

      for (let r = 1; r < placementDefinition.spanRows; r++) {
        if (getBlockingTileOccupyingCell(col, row + r)) {
          hideCellHighlight();
          return;
        }
      }
    }

    showCellHighlight(col, row, "green");
  } else {
    hideCellHighlight();
  }
}

placementPreview.addEventListener("error", () => {
  console.error("Unable to load placement image:", placementPreview.src);
});

workspace.addEventListener("mousedown", event => {
  if (deleteMode) {
    beginDeleteMarquee(event);
  } else {
    beginMarqueeSelection(event);
  }
});

workspace.addEventListener("mousemove", event => {
  if (deleteMarqueeSelecting) {
    updateDeleteMarquee(event);
  }

  if (marqueeSelecting) {
    updateMarqueeDrag(event);
  }

  if (groupMoveActive) {
    const point = eventToCanvasPoint(event);
    updateGroupMovePreviewFromPointer(point);
  }

  if (placementMode) {
    placementPreview.style.left = event.clientX + "px";
    placementPreview.style.top = event.clientY + "px";
  }

  hoveredCell = getCellFromMouse(event);
  updateHighlightForHoveredCell();
});


window.addEventListener("mouseup", event => {
  if (event.button !== 0) return;

  if (deleteMarqueeSelecting) {
    finishDeleteMarquee(event);
    return;
  }

  if (marqueeSelecting) {
    finishMarqueeDrag(event);
  }
});

workspace.addEventListener("mouseenter", () => {
  if (placementMode) placementPreview.style.display = "block";
});

workspace.addEventListener("mouseleave", () => {
  hoveredCell = null;
  hideCellHighlight();

  if (placementMode) {
    placementPreview.style.display = "none";
  }
});

workspace.addEventListener("click", async event => {
  if (suppressNextWorkspaceClick) {
    suppressNextWorkspaceClick = false;
    return;
  }

  if (groupMoveActive) {
    const point = eventToCanvasPoint(event);
    updateGroupMovePreviewFromPointer(point);

    if (groupMoveValid) {
      if (copyMode) {
        commitGroupCopy();
      } else {
        commitGroupMove();
      }
    }
    return;
  }

  if (!editorEnabled) return;

  const cell = getCellFromMouse(event);
  if (!cell) return;

  const { col, row } = cell;

  if (deleteMode) {
    const tile = getTileOccupyingCell(col, row);
    if (tile) {
      tile.remove();
      updateHighlightForHoveredCell();
    }
    return;
  }

  if (!placementMode || !placementImage || !placementDefinition) return;

  const isOverlay = placementDefinition.overlay === true;

  // Ordinary blocks must fit completely within the grid and may not overlap
  // any existing non-overlay block in any major cell they occupy. Vertical
  // Shunts are overlays and are handled separately.
  if (!isOverlay) {
    if (row + placementDefinition.spanRows - 1 >= majorRows) return;

    for (let r = 0; r < placementDefinition.spanRows; r++) {
      if (getBlockingTileOccupyingCell(col, row + r)) return;
    }
  }

  const bindingConfiguration = await configureBooleanBindingForNewBlock(placementDefinition.programType);
  if (["normally_open", "normally_closed", "pgt_contact", "ngt_contact", "coil"].includes(placementDefinition.programType) && !bindingConfiguration) {
    return;
  }

  const image = document.createElement("img");
  image.src = placementImage;
  image.alt = placementLabel;
  image.className = "placed-tile";
  image.dataset.blockId = String(nextBlockId++);
  image.dataset.programType = placementDefinition.programType || "";
  image.dataset.blockType = placementLabel;
  image.dataset.majorColumn = col;
  image.dataset.majorRow = row;
  image.dataset.spanRows = placementDefinition.spanRows;
  image.dataset.overlay = placementDefinition.overlay ? "true" : "false";
  if (placementDefinition.key === "vertical_shunt") {
    image.classList.add("vertical-shunt");
  }
  const newProperties = defaultPropertiesForType(placementDefinition.programType);
  const newPorts = defaultPortsForType(placementDefinition.programType);
  if (bindingConfiguration?.logicalPoint) {
    newProperties.logicalPoint = bindingConfiguration.logicalPoint;
    newProperties.descriptor = bindingConfiguration.descriptor;
    newProperties.bindingKind = bindingConfiguration.bindingKind;
    if (["normally_open", "normally_closed", "pgt_contact", "ngt_contact"].includes(placementDefinition.programType)) {
      setPortBinding(newPorts, "condition", bindingConfiguration.logicalPoint);
    } else if (placementDefinition.programType === "coil") {
      setPortBinding(newPorts, "output", bindingConfiguration.logicalPoint);
    }
  }
  image.dataset.properties = JSON.stringify(newProperties);
  image.dataset.ports = JSON.stringify(newPorts);
  updatePlacedTileBindingMetadata(image, newProperties);


  if (placementDefinition.key === "vertical_shunt") {
    // The overlay is anchored in the clicked cell and spans into the cell below.
    image.style.left = (col * majorCellSize) + "px";

    if (cellContainsTimerOrCounter(col, row)) {
      // Timer/Counter: place the right-edge shunt variant.
      image.dataset.variant = "right";
      image.src = resolveImage("./images/vertical_shunt_right.png");
    } else {
      // Empty cell, contact, or horizontal shunt: place the left variant.
      image.dataset.variant = "left";
      image.src = resolveImage("./images/vertical_shunt_left.png");
    }
  } else {
    image.style.left = (col * majorCellSize) + "px";
  }

  image.style.top =
    (row * majorCellSize + placementDefinition.topOffset) + "px";

  if (placementDefinition.overlay) {
    image.style.zIndex = "1000";
  }

  ladderCanvas.appendChild(image);
  bringVerticalShuntsToFront();
  refreshBooleanBindingMetadata();
  requestBindingGridLabelSync();
  updateHighlightForHoveredCell();
});

workspace.addEventListener("contextmenu", event => {
  if (deleteMarqueeSelecting) {
    event.preventDefault();
    cancelDeleteMarquee();
    return;
  }

  if (groupMoveActive || marqueeSelecting) {
    event.preventDefault();
    cancelGroupMove();
    return;
  }

  if (placementMode) {
    event.preventDefault();
    cancelPlacementMode();
    updateHighlightForHoveredCell();
  }
});

updateCanvasHeight();
syncProjectIdentityUi();
setPlcState("DISCONNECTED");
setEditorEnabled(false);
</script>
</body>
