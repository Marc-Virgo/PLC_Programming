/* v1.41 logical-point and descriptor labels for contacts/coils */
.binding-grid-label {
  position:absolute;
  width:136px;
  text-align:center;
  pointer-events:none;
  z-index:1500;
  font-family:Arial,Helvetica,sans-serif;
  line-height:1.08;
  color:#111827;
  height:56px;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
}
.binding-grid-label .logical-point {
  display:block;
  font-family:Consolas,"Courier New",monospace;
  font-size:18px;
  line-height:20px;
  font-weight:700;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.binding-grid-label .descriptor {
  position:relative;
  display:-webkit-box;
  -webkit-box-orient:vertical;
  -webkit-line-clamp:2;
  overflow:hidden;
  margin:2px auto 0;
  max-width:132px;
  min-height:28px;
  font-size:12px;
  font-weight:600;
  line-height:14px;
  overflow-wrap:anywhere;
  pointer-events:auto;
  cursor:help;
}
.binding-grid-label .descriptor::after {
  content:attr(data-full-text);
  position:absolute;
  left:50%;
  top:calc(100% + 7px);
  transform:translateX(-50%);
  width:max-content;
  max-width:300px;
  padding:7px 9px;
  border:1px solid #4b5563;
  border-radius:6px;
  background:#111827;
  color:#fff;
  font-size:12px;
  font-weight:400;
  line-height:1.3;
  text-align:left;
  white-space:normal;
  box-shadow:0 4px 12px rgba(0,0,0,.22);
  opacity:0;
  visibility:hidden;
  transition:opacity .12s linear .55s, visibility 0s linear .67s;
  z-index:5000;
}
.binding-grid-label .descriptor:hover::after {
  opacity:1;
  visibility:visible;
  transition-delay:.55s, .55s;
}

/* v1.15 two-row ribbon */
.app {
  grid-template-rows: 116px 1fr;
}
.topbar {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  grid-template-rows: 42px 42px;
  align-content: center;
  column-gap: 12px;
  row-gap: 6px;
  align-items: center;
  padding: 10px 16px;
}
.topbar .title {
  grid-column: 1;
  grid-row: 1;
  margin-right: 12px;
}
.ribbon-main-controls {
  grid-column: 2;
  grid-row: 1;
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
}
.ribbon-main-controls .file-button.first {
  margin-left: auto;
}
.ribbon-main-controls.editor-disabled .home-button {
  margin-left: auto;
}
.ribbon-action-row {
  grid-column: 2;
  grid-row: 2;
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 42px;
}
.ribbon-action-row.hidden {
  display: none !important;
}
@media(max-width:700px){
  .app { grid-template-rows: auto 1fr; }
  .topbar {
    grid-template-columns: 1fr;
    grid-template-rows: auto auto auto;
  }
  .topbar .title {
    grid-column: 1;
    grid-row: 1;
  }
  .ribbon-main-controls {
    grid-column: 1;
    grid-row: 2;
    flex-wrap: wrap;
  }
  .ribbon-action-row {
    grid-column: 1;
    grid-row: 3;
    flex-wrap: wrap;
  }
  .ribbon-main-controls .file-button.first {
    margin-left: 0;
  }
}


/* v1.20 rung-number gutter

   left of the power rail for centered three-digit rung numbers. */
.ladder-canvas {
  margin-left: 84px;
}
.rung-number-layer {
  position: absolute;
  left: -84px;
  top: 0;
  width: 84px;
  height: 100%;
  pointer-events: none;
  user-select: none;
  z-index: 25;
}
.rung-number {
  position: absolute;
  left: 0;
  width: 84px;
  height: 140px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: Consolas, "Courier New", monospace;
  font-size: 22px;
  font-weight: 700;
  color: #374151;
}

function crc32Text(text) {
  const table = crc32Text.table || (crc32Text.table = (() => {
    const t = new Uint32Array(256);
    for (let n = 0; n < 256; n++) {
      let c = n;
      for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      t[n] = c >>> 0;
    }
    return t;
  })());
  let crc = 0xFFFFFFFF;
  for (const byte of new TextEncoder().encode(text)) crc = table[(crc ^ byte) & 0xFF] ^ (crc >>> 8);
  return (crc ^ 0xFFFFFFFF) >>> 0;
}

function buildOptimizedConfiguration(configuration = getRawPlcConfiguration()) {
  const controllerMap = { pico:"PICO", pico_w:"PICO_W", pico2:"PICO_2", pico2_w:"PICO_2_W" };
  const model = configuration?.controller?.model || configuration?.picoType || "pico2_w";

  // v1.43: Prefer configuration.html v1.7+ canonical arrays.  Legacy ioState is
  // retained only as a migration fallback for projects saved by older versions.
  if (configuration?.schema === "PICO_PLC_CONFIGURATION" && Array.isArray(configuration.gpio)) {
    const gpio = configuration.gpio
      .filter(row => row && row.enabled)
      .map(row => [
        row.pin || `GP${Number(row.gpio)}`,
        row.function || "",
        row.logicalPoint || null,
        row.descriptor || "",
        row.physicalPin ?? null,
        1
      ]);

    const mcp = (Array.isArray(configuration.mcp23017) ? configuration.mcp23017 : [])
      .map(device => [
        String(device.address || "").toLowerCase(),
        (Array.isArray(device.pins) ? device.pins : [])
          .filter(pin => pin && pin.enabled)
          .map(pin => [pin.pin, pin.function || "", pin.logicalPoint || null, pin.descriptor || "", 1])
      ]);

    const io = (Array.isArray(configuration.io) ? configuration.io : [])
      .filter(row => row && row.logicalPoint)
      .map(row => [
        normalizeLogicalPoint(row.logicalPoint) || row.logicalPoint,
        String(row.direction || "").toLowerCase() === "input" ? 0 : 1,
        row.resource || "",
        row.pin || "",
        row.descriptor || ""
      ]);

    return {
      schema: configuration.schema,
      schemaVersion: configuration.schemaVersion || 1,
      controller: controllerMap[model] || String(model).toUpperCase(),
      gpio,
      mcp,
      io
    };
  }

  // Legacy configuration fallback.
  const gpio = [];
  const mcpMap = new Map();
  const io = [];
  const ioState = configuration?.ioState && typeof configuration.ioState === "object" ? configuration.ioState : {};
  const logicalByKey = new Map(getConfiguredDigitalIOPoints().map(point => [`${point.resource}|${point.pin}`, point]));

  for (const [key, stateRaw] of Object.entries(ioState)) {
    const state = stateRaw || {};
    const split = key.lastIndexOf("|");
    const resource = split >= 0 ? key.slice(0, split) : key;
    const pin = split >= 0 ? key.slice(split + 1) : "";
    const enabled = ["enabled", "used"].includes(String(state.active || "").toLowerCase());
    if (!enabled) continue;
    const fn = state.function || "";
    const descriptor = state.descriptor || "";
    const logicalPoint = logicalByKey.get(key)?.logicalPoint || null;

    if (resource === "Raspberry Pi Pico") {
      gpio.push([pin, fn, logicalPoint, descriptor, null, 1]);
    } else {
      const match = /MCP23017\s*@\s*(0x[0-9a-f]+)/i.exec(resource);
      if (match) {
        const address = match[1].toLowerCase();
        if (!mcpMap.has(address)) mcpMap.set(address, []);
        mcpMap.get(address).push([pin, fn, logicalPoint, descriptor, 1]);
      }
    }
    if (logicalPoint && (fn === "Input" || fn === "Output")) {
      io.push([logicalPoint, fn === "Input" ? 0 : 1, resource, pin, descriptor]);
    }
  }

  for (const device of configuration?.i2cDevices || []) {
    if (device?.type !== "MCP23017" || !device.address) continue;
    const addr = String(device.address).toLowerCase();
    if (!mcpMap.has(addr)) mcpMap.set(addr, []);
  }

  return {
    controller: controllerMap[model] || "PICO_2_W",
    gpio,
    mcp: [...mcpMap.entries()].map(([address, pins]) => [address, pins]),
    io
  };
}

function buildTransferArtifacts() {
  const verbose = buildAuthoritativeVerboseProject();
  const optimized = buildOptimizedProgram(verbose.ladder, verbose.project);
  // The optimized/package CRC is defined over the optimized representation before
  // its crc member is appended, avoiding a self-referential checksum.
  const optimizedCRC = crc32Text(JSON.stringify(optimized));
  optimized.crc = {
    config: verbose.project.configCRC,
    ladder: crc32Text(JSON.stringify(optimized.r || [])),
    package: optimizedCRC
  };
  verbose.project.optimizedCRC = optimizedCRC;
  const verboseText = JSON.stringify(verbose, null, 2) + "\n";
  const optimizedText = JSON.stringify(optimized, null, 2) + "\n";
  return {
    verbose,
    optimized,
    verboseText,
    optimizedText,
    // Transport CRCs cover the exact bytes written to flash. They are separate
    // from semantic/source CRCs stored inside the project metadata.
    sourceTransferCRC: crc32Text(verboseText),
    optimizedTransferCRC: crc32Text(optimizedText)
  };
}

function getConfigurationForProgram() {
  const fallback = { controller: "PICO_2_W", mcp23017: [] };

  try {
    const config = getRawPlcConfiguration();
    if (!config || !Object.keys(config).length) return fallback;
    const controllerMap = {
      pico: "PICO",
      pico_w: "PICO_W",
      pico2: "PICO_2",
      pico2_w: "PICO_2_W"
    };
    const model = config?.controller?.model || config?.picoType;
    const devices = Array.isArray(config.mcp23017)
      ? config.mcp23017.map(device => ({ address: device.address, enabled: true }))
      : Array.isArray(config.i2cDevices)
        ? config.i2cDevices.filter(device => device && device.type === "MCP23017")
            .map(device => ({ address: device.address, enabled: true }))
        : [];
    return {
      controller: controllerMap[model] || fallback.controller,
      mcp23017: devices
    };
  } catch (error) {
    console.warn("Unable to read PLC configuration:", error);
    return fallback;
  }
}


function getConfiguredDigitalIOPoints() {
  const config = getRawPlcConfiguration();
  if (!config || !Object.keys(config).length) return [];

  // v1.43 canonical path: configuration.html assigns and persists the logical
  // point. ladder.html must never independently renumber physical I/O.
  if (config?.schema === "PICO_PLC_CONFIGURATION" && Array.isArray(config.io)) {
    return config.io
      .filter(row => row && row.logicalPoint && ["input", "output"].includes(String(row.direction || "").toLowerCase()))
      .map(row => ({
        logicalPoint: normalizeLogicalPoint(row.logicalPoint) || String(row.logicalPoint),
        function: String(row.direction).toLowerCase() === "input" ? "Input" : "Output",
        descriptor: String(row.descriptor || "").trim(),
        resource: String(row.resource || ""),
        pin: String(row.pin || "")
      }))
      .sort((a, b) => {
        const ap = logicalPointNumber(a.logicalPoint), bp = logicalPointNumber(b.logicalPoint);
        if (!ap || !bp) return a.logicalPoint.localeCompare(b.logicalPoint);
        return ap.type.localeCompare(bp.type) || ap.number - bp.number;
      });
  }

  // Legacy fallback for configuration.html <= v1.6.  Use stored logicalPoint
  // where present; generate only for legacy rows that truly have no address.
  const ioState = config?.ioState;
  if (!ioState || typeof ioState !== "object") return [];

  const pinOrder = pin => {
    const pico = /^GP(\d+)$/.exec(pin);
    if (pico) return Number(pico[1]);
    const mcp = /^GP([AB])(\d)$/.exec(pin);
    if (mcp) return (mcp[1] === "A" ? 100 : 108) + Number(mcp[2]);
    return 999;
  };
  const resourceOrder = resource => {
    if (resource === "Raspberry Pi Pico") return [0, 0];
    const match = /MCP23017\s*@\s*0x([0-9a-f]+)/i.exec(resource);
    return [1, match ? parseInt(match[1], 16) : 999];
  };

  const rows = Object.entries(ioState).map(([key, state]) => {
    const split = key.lastIndexOf("|");
    const resource = split >= 0 ? key.slice(0, split) : key;
    const pin = split >= 0 ? key.slice(split + 1) : "";
    return { key, resource, pin, state: state || {} };
  }).filter(row =>
    ["enabled", "used"].includes(String(row.state.active || "").toLowerCase()) &&
    (row.state.function === "Input" || row.state.function === "Output")
  );

  rows.sort((a, b) => {
    const ar = resourceOrder(a.resource), br = resourceOrder(b.resource);
    return ar[0] - br[0] || ar[1] - br[1] || pinOrder(a.pin) - pinOrder(b.pin);
  });

  let inputNumber = 1;
  let outputNumber = 1;
  return rows.map(row => {
    const isInput = row.state.function === "Input";
    let logicalPoint = normalizeLogicalPoint(row.state.logicalPoint);
    if (!logicalPoint) {
      const number = isInput ? inputNumber++ : outputNumber++;
      logicalPoint = `${isInput ? "I" : "O"}:${String(number).padStart(5, "0")}`;
    }
    return {
      logicalPoint,
      function: row.state.function,
      descriptor: String(row.state.descriptor || "").trim(),
      resource: row.resource,
      pin: row.pin
    };
  });
}

function logicalPointNumber(logicalPoint) {
  const match = /^([IO]):(\d{1,5})$/i.exec(String(logicalPoint || "").trim());
  return match ? { type: match[1].toUpperCase(), number: Number(match[2]) } : null;
}

function normalizeLogicalPoint(value) {
  const parsed = logicalPointNumber(value);
  return parsed ? `${parsed.type}:${String(parsed.number).padStart(5, "0")}` : null;
}

function isVirtualCoilLogicalPoint(logicalPoint) {
  const parsed = logicalPointNumber(logicalPoint);
  return !!parsed && parsed.type === "O" && parsed.number >= 10001 && parsed.number <= 19999;
}

function getVirtualCoilDefinitions(excludeTile = null) {
  const definitions = [];
  ladderCanvas.querySelectorAll('.placed-tile[data-program-type="coil"]').forEach(tile => {
    if (tile === excludeTile) return;
    let properties = {};
    try { properties = JSON.parse(tile.dataset.properties || "{}"); } catch (error) {}
    const logicalPoint = normalizeLogicalPoint(properties.logicalPoint);
    if (!logicalPoint || !isVirtualCoilLogicalPoint(logicalPoint)) return;
    definitions.push({
      logicalPoint,
      descriptor: String(properties.descriptor || "").trim(),
      blockId: Number(tile.dataset.blockId || 0)
    });
  });
  definitions.sort((a, b) => logicalPointNumber(a.logicalPoint).number - logicalPointNumber(b.logicalPoint).number);
  return definitions;
}

function nextVirtualCoilLogicalPoint() {
  const used = new Set(getVirtualCoilDefinitions().map(item => logicalPointNumber(item.logicalPoint).number));
  for (let number = 10001; number <= 19999; number++) {
    if (!used.has(number)) return `O:${String(number).padStart(5, "0")}`;
  }
  throw new Error("The virtual coil address range O:10001–O:19999 is full.");
}

function getBindingDescriptor(logicalPoint) {
  const normalized = normalizeLogicalPoint(logicalPoint);
  if (!normalized) return null;
  const physical = getConfiguredDigitalIOPoints().find(point => point.logicalPoint === normalized);
  if (physical) return physical.descriptor;
  const virtual = getVirtualCoilDefinitions().find(point => point.logicalPoint === normalized);
  return virtual ? virtual.descriptor : null;
}

function showBindingPicker({ title, instruction, options, allowVirtual = false, defaultValue = "" }) {
  return new Promise(resolve => {
    const backdrop = document.createElement("div");
    backdrop.className = "binding-picker-backdrop";

    const panel = document.createElement("div");
    panel.className = "binding-picker";
    panel.setAttribute("role", "dialog");
    panel.setAttribute("aria-modal", "true");
    panel.setAttribute("aria-label", title);

    const heading = document.createElement("h3");
    heading.textContent = title;
    const help = document.createElement("p");
    help.textContent = instruction;
    const input = document.createElement("input");
    input.type = "text";
    input.placeholder = allowVirtual ? "Next virtual coil or select a physical output" : "Select a point below";
    input.autocomplete = "off";
    input.value = defaultValue;

    const list = document.createElement("div");
    list.className = "binding-picker-list";

    options.forEach(option => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "binding-picker-option";
      button.dataset.value = option.logicalPoint;
      const point = document.createElement("span");
      point.className = "point";
      point.textContent = option.logicalPoint;
      const desc = document.createElement("span");
      desc.textContent = option.descriptor || "";
      button.append(point, desc);
      button.addEventListener("click", () => {
        input.value = option.logicalPoint;
        input.focus();
        input.select();
      });
      list.appendChild(button);
    });

    if (allowVirtual && defaultValue) {
      const virtualButton = document.createElement("button");
      virtualButton.type = "button";
      virtualButton.className = "binding-picker-option create-virtual";
      virtualButton.dataset.value = defaultValue;
      const point = document.createElement("span");
      point.className = "point";
      point.textContent = defaultValue;
      const desc = document.createElement("span");
      desc.textContent = "Create next virtual coil";
      virtualButton.append(point, desc);
      virtualButton.addEventListener("click", () => {
        input.value = defaultValue;
        input.focus();
        input.select();
      });
      list.appendChild(virtualButton);
    }

    const actions = document.createElement("div");
    actions.className = "binding-picker-actions";
    const cancel = document.createElement("button");
    cancel.type = "button";
    cancel.className = "binding-picker-cancel";
    cancel.textContent = "Cancel";
    const ok = document.createElement("button");
    ok.type = "button";
    ok.className = "binding-picker-ok";
    ok.textContent = "Use Selected Point";
    actions.append(cancel, ok);

    panel.append(heading, help, input, list, actions);
    backdrop.appendChild(panel);
    document.body.appendChild(backdrop);

    const finish = value => {
      backdrop.remove();
      resolve(value);
    };
    cancel.addEventListener("click", () => finish(null));
    ok.addEventListener("click", () => finish(input.value.trim()));
    input.addEventListener("keydown", event => {
      if (event.key === "Enter") finish(input.value.trim());
      if (event.key === "Escape") finish(null);
    });
    backdrop.addEventListener("mousedown", event => {
      if (event.target === backdrop) finish(null);
    });
    requestAnimationFrame(() => input.focus());
  });
}

async function promptForContactBinding(currentLogicalPoint = "") {
  const physical = getConfiguredDigitalIOPoints();
  const virtual = getVirtualCoilDefinitions();
  const available = [
    ...physical.map(point => ({
      logicalPoint: point.logicalPoint,
      descriptor: point.descriptor || `${point.resource} ${point.pin}`
    })),
    ...virtual.map(point => ({ logicalPoint: point.logicalPoint, descriptor: point.descriptor }))
  ];

  if (!available.length) {
    alert("No Digital I/O points or virtual coils are available. Configure physical I/O first, or place a virtual coil before using a contact tied to it.");
    return null;
  }

  const normalizedCurrent = normalizeLogicalPoint(currentLogicalPoint) || "";
  const entered = await showBindingPicker({
    title: normalizedCurrent ? "Edit Contact Binding" : "Bind Contact",
    instruction: "Click an available I/O point or virtual coil to fill the entry field, then choose Use Selected Point.",
    options: available,
    defaultValue: normalizedCurrent
  });
  if (entered === null) return null;
  const logicalPoint = normalizeLogicalPoint(entered);
  if (!logicalPoint) {
    alert("Select a logical point such as I:00001 or O:10001.");
    return await promptForContactBinding(currentLogicalPoint);
  }

  const physicalPoint = physical.find(point => point.logicalPoint === logicalPoint);
  const virtualPoint = virtual.find(point => point.logicalPoint === logicalPoint);
  if (!physicalPoint && !virtualPoint) {
    alert(`${logicalPoint} is not an available physical I/O point or an existing virtual coil.`);
    return promptForContactBinding(currentLogicalPoint);
  }

  return {
    logicalPoint,
    descriptor: (physicalPoint || virtualPoint).descriptor || "",
    bindingKind: virtualPoint ? "virtual_coil" : "physical_io"
  };
}

async function promptForCoilBinding(currentTile = null) {
  const physicalOutputs = getConfiguredDigitalIOPoints().filter(point => point.function === "Output");
  const options = physicalOutputs.map(point => ({
    logicalPoint: point.logicalPoint,
    descriptor: point.descriptor || `${point.resource} ${point.pin}`
  }));

  let currentProperties = {};
  if (currentTile) {
    try { currentProperties = JSON.parse(currentTile.dataset.properties || "{}"); } catch (error) {}
  }
  const currentLogical = normalizeLogicalPoint(currentProperties.logicalPoint);
  const currentIsVirtual = isVirtualCoilLogicalPoint(currentLogical);
  const nextVirtual = nextVirtualCoilLogicalPoint();
  if (currentIsVirtual) {
    options.push({ logicalPoint: currentLogical, descriptor: currentProperties.descriptor || "Current virtual coil" });
    if (nextVirtual !== currentLogical) options.push({ logicalPoint: nextVirtual, descriptor: "Create another virtual coil" });
  }

  const defaultLogical = currentLogical || nextVirtual;
  const entered = await showBindingPicker({
    title: currentTile ? "Edit Coil Binding" : "Bind Coil",
    instruction: currentTile
      ? `Current binding is ${defaultLogical}. Select a physical output, keep the current virtual coil, or select ${nextVirtual} to create a new virtual coil.`
      : `The next available virtual coil (${nextVirtual}) is selected automatically. Press Enter to use it and enter its Descriptor, or click a physical output to override it.`,
    options,
    allowVirtual: !currentIsVirtual,
    defaultValue: defaultLogical
  });
  if (entered === null) return null;

  const logicalPoint = normalizeLogicalPoint(entered);

  if (logicalPoint && isVirtualCoilLogicalPoint(logicalPoint)) {
    const duplicate = getVirtualCoilDefinitions(currentTile).some(item => item.logicalPoint === logicalPoint);
    if (duplicate) {
      alert(`${logicalPoint} is already assigned to another virtual coil. The next available virtual coil is ${nextVirtualCoilLogicalPoint()}.`);
      return promptForCoilBinding(currentTile);
    }
    const existingDescriptor = currentIsVirtual && logicalPoint === currentLogical ? (currentProperties.descriptor || "") : "";
    const descriptor = prompt(`Descriptor for virtual coil ${logicalPoint}:`, existingDescriptor);
    if (descriptor === null) return null;
    if (!descriptor.trim()) {
      alert("A virtual coil must have a Descriptor.");
      return promptForCoilBinding(currentTile);
    }
    return { logicalPoint, descriptor: descriptor.trim(), bindingKind: "virtual_coil" };
  }

  const physicalPoint = physicalOutputs.find(point => point.logicalPoint === logicalPoint);
  if (!physicalPoint) {
    alert(`Select a configured physical output, or use an available virtual coil.`);
    return promptForCoilBinding(currentTile);
  }
  return {
    logicalPoint,
    descriptor: physicalPoint.descriptor || "",
    bindingKind: "physical_output"
  };
}

function showElementPropertyEditor({ title, fields, values }) {
  return new Promise(resolve => {
    const backdrop = document.createElement("div");
    backdrop.className = "binding-picker-backdrop";
    const panel = document.createElement("div");
    panel.className = "binding-picker";
    panel.setAttribute("role", "dialog");
    panel.setAttribute("aria-modal", "true");
    panel.setAttribute("aria-label", title);

    const heading = document.createElement("h3");
    heading.textContent = title;
    const note = document.createElement("p");
    note.className = "element-editor-note";
    note.textContent = "Edit the configurable values for this ladder element. Logic-path connections are determined by grid position.";
    const grid = document.createElement("div");
    grid.className = "element-editor-grid";
    const controls = new Map();

    fields.forEach(field => {
      const label = document.createElement("label");
      label.textContent = field.label;
      const input = document.createElement(field.options ? "select" : "input");
      input.dataset.field = field.key;
      if (field.options) {
        field.options.forEach(option => {
          const item = document.createElement("option");
          item.value = option.value;
          item.textContent = option.label;
          input.appendChild(item);
        });
      } else {
        input.type = field.type || "text";
        if (field.step != null) input.step = String(field.step);
        if (field.min != null) input.min = String(field.min);
        if (field.placeholder) input.placeholder = field.placeholder;
      }
      const value = values[field.key];
      if (field.type === "checkbox") {
        input.type = "checkbox";
        input.checked = !!value;
      } else {
        input.value = value == null ? "" : String(value);
      }
      if (field.readOnly) {
        input.disabled = true;
        input.classList.add("element-editor-readonly");
      }
      controls.set(field.key, { input, field });
      grid.append(label, input);
    });

    const actions = document.createElement("div");
    actions.className = "binding-picker-actions";
    const cancel = document.createElement("button");
    cancel.type = "button";
    cancel.className = "binding-picker-cancel";
    cancel.textContent = "Cancel";
    const save = document.createElement("button");
    save.type = "button";
    save.className = "binding-picker-ok";
    save.textContent = "Save Changes";
    actions.append(cancel, save);
    panel.append(heading, note, grid, actions);
    backdrop.appendChild(panel);
    document.body.appendChild(backdrop);

    const finish = result => { backdrop.remove(); resolve(result); };
    cancel.addEventListener("click", () => finish(null));
    backdrop.addEventListener("mousedown", event => { if (event.target === backdrop) finish(null); });
    panel.addEventListener("keydown", event => { if (event.key === "Escape") finish(null); });
    save.addEventListener("click", () => {
      const result = { ...values };
      for (const [key, { input, field }] of controls) {
        if (field.readOnly) continue;
        if (field.type === "checkbox") result[key] = input.checked;
        else if (field.type === "number") {
          const number = Number(input.value);
          if (!Number.isFinite(number) || (field.min != null && number < field.min)) {
            alert(`${field.label} must be a valid number${field.min != null ? ` greater than or equal to ${field.min}` : ""}.`);
            input.focus(); return;
          }
          result[key] = field.integer ? Math.trunc(number) : number;
        } else result[key] = input.value.trim() || null;
      }
      finish(result);
    });
    requestAnimationFrame(() => controls.values().next().value?.input?.focus());
  });
}

function elementEditorFields(type) {
  const reg = (key, label) => ({ key, label, type: "text", placeholder: "Register / data reference" });
  switch (type) {
    case "timer": return [{ key:"presetMs", label:"Preset (ms)", type:"number", min:0, step:1 }];
    case "counter": return [{ key:"preset", label:"Preset Count", type:"number", min:0, step:1, integer:true }];
    case "add": return [reg("addend1","Addend 1"), reg("addend2","Addend 2"), reg("result","Result")];
    case "subtract": return [reg("minuend","Minuend"), reg("subtrahend","Subtrahend"), reg("result","Result")];
    case "multiply": return [reg("multiplicand","Multiplicand"), reg("multiplier","Multiplier"), reg("result","Result")];
    case "divide": return [reg("dividend","Dividend"), reg("divisor","Divisor"), reg("result","Quotient / Result"), reg("remainder","Remainder")];
    case "block_move": return [reg("source","Source"), reg("destination","Destination"), {key:"length",label:"Table Length",type:"number",min:1,step:1,integer:true}];
    case "analog_in": return [reg("adcInput","ADC Input"), reg("result","Result Register"), reg("sampleRateTimer","Sample-rate Timer")];
    case "analog_out": return [reg("pwmOutput","PWM Output"), reg("source","Source Register"), reg("sampleRateTimer","Sample-rate Timer")];
    case "pid": return [
      reg("setpoint","Setpoint Register"), reg("input","Process Input Register"), reg("output","Output Register"),
      {key:"kp",label:"Kp",type:"number",step:"any"},{key:"ki",label:"Ki",type:"number",step:"any"},{key:"kd",label:"Kd",type:"number",step:"any"},
      {key:"dt",label:"Δt (s)",type:"number",min:0,step:"any"},{key:"openLoop",label:"Open Loop",type:"checkbox"},{key:"manualOutput",label:"Manual Output",type:"number",step:"any"}
    ];
    default: return [];
  }
}

async function editPlacedElement(tile) {
  if (!tile || !editorEnabled) return;
  const type = getProgramTypeFromTile(tile);
  if (!type) return;

  let properties = defaultPropertiesForType(type);
  let ports = defaultPortsForType(type);
  try { properties = { ...properties, ...JSON.parse(tile.dataset.properties || "{}") }; } catch (error) {}
  try { ports = JSON.parse(tile.dataset.ports || JSON.stringify(ports)); } catch (error) {}

  if (["normally_open","normally_closed","pgt_contact","ngt_contact"].includes(type)) {
    const binding = await promptForContactBinding(properties.logicalPoint);
    if (!binding) return;
    properties = { ...properties, ...binding };
    setPortBinding(ports, "condition", binding.logicalPoint);
    tile.dataset.properties = JSON.stringify(properties);
    tile.dataset.ports = JSON.stringify(ports);
    refreshBooleanBindingMetadata();
    return;
  }

  if (type === "coil") {
    const oldLogical = normalizeLogicalPoint(properties.logicalPoint);
    const binding = await promptForCoilBinding(tile);
    if (!binding) return;
    properties = { ...properties, ...binding };
    setPortBinding(ports, "output", binding.logicalPoint);
    tile.dataset.properties = JSON.stringify(properties);
    tile.dataset.ports = JSON.stringify(ports);
    // If a virtual coil moved to a new address, contacts still bound to the old
    // address are intentionally not silently retargeted; they become invalid and
    // can be rebound explicitly. Descriptor edits on the same address propagate.
    refreshBooleanBindingMetadata();
    if (oldLogical && isVirtualCoilLogicalPoint(oldLogical) && oldLogical !== binding.logicalPoint) {
      requestBindingGridLabelSync();
    }
    return;
  }

  if (type === "vertical_shunt") {
    const fields = [{ key:"variant", label:"Shunt Side", options:[{value:"left",label:"Left"},{value:"right",label:"Right"}] }];
    const result = await showElementPropertyEditor({ title:"Edit Vertical Shunt", fields, values:{variant:getVerticalShuntVariant(tile)} });
    if (!result) return;
    tile.dataset.variant = result.variant;
    tile.src = resolveImage(result.variant === "right" ? "./images/vertical_shunt_right.png" : "./images/vertical_shunt_left.png");
    return;
  }

  if (type === "horizontal_shunt") {
    await showElementPropertyEditor({ title:"Horizontal Shunt", fields:[{key:"message",label:"Binding",type:"text",readOnly:true}], values:{message:"Topology only — no editable binding"} });
    return;
  }

  const fields = elementEditorFields(type);
  if (!fields.length) return;
  const updated = await showElementPropertyEditor({ title:`Edit ${programTypeToLabel[type] || type}`, fields, values:properties });
  if (!updated) return;
  tile.dataset.properties = JSON.stringify({ ...properties, ...updated });
}

async function configureBooleanBindingForNewBlock(type) {
  if (["normally_open", "normally_closed", "pgt_contact", "ngt_contact"].includes(type)) {
    return promptForContactBinding();
  }
  if (type === "coil") return await promptForCoilBinding();
  return { logicalPoint: null, descriptor: "", bindingKind: null };
}

function updatePlacedTileBindingMetadata(tile, properties) {
  const logicalPoint = normalizeLogicalPoint(properties?.logicalPoint);
  if (!logicalPoint) {
    tile.removeAttribute("title");
    return;
  }
  const descriptor = String(properties?.descriptor || "").trim();
  tile.title = descriptor ? `${logicalPoint} — ${descriptor}` : logicalPoint;
  tile.setAttribute("aria-label", tile.title);
}

const BOOLEAN_BINDING_TYPES = new Set([
  "normally_open", "normally_closed", "pgt_contact", "ngt_contact", "coil"
]);

function syncBindingGridLabels() {
  const activeIds = new Set();

  ladderCanvas.querySelectorAll(".placed-tile").forEach(tile => {
    const type = getProgramTypeFromTile(tile);
    if (!BOOLEAN_BINDING_TYPES.has(type)) return;

    const blockId = String(tile.dataset.blockId || "");
    if (!blockId) return;
    activeIds.add(blockId);

    let properties = {};
    try { properties = JSON.parse(tile.dataset.properties || "{}"); } catch (error) {}
    const logicalPoint = normalizeLogicalPoint(properties.logicalPoint);
    const descriptor = String(properties.descriptor || "").trim();

    let label = ladderCanvas.querySelector(`.binding-grid-label[data-label-for="${CSS.escape(blockId)}"]`);
    if (!label) {
      label = document.createElement("div");
      label.className = "binding-grid-label";
      label.dataset.labelFor = blockId;
      label.innerHTML = '<span class="logical-point"></span><span class="descriptor"></span>';
      ladderCanvas.appendChild(label);
    }

    // Position the annotation 14 px lower than the previous bottom-aligned anchor.
    // This intentionally lets the I/O number and descriptor sit lower in the major cell.
    const tileLeft = Number.parseFloat(tile.style.left) || 0;
    const tileTop = Number.parseFloat(tile.style.top) || 0;
    label.style.left = (tileLeft + 2) + "px";
    label.style.top = (tileTop + 98) + "px";

    const pointNode = label.querySelector(".logical-point");
    const descriptorNode = label.querySelector(".descriptor");
    pointNode.textContent = logicalPoint || "";
    descriptorNode.textContent = descriptor;
    descriptorNode.dataset.fullText = descriptor;
    descriptorNode.title = descriptor;
    descriptorNode.setAttribute("aria-label", descriptor || "No descriptor");
    descriptorNode.style.display = descriptor ? "-webkit-box" : "none";
  });

  ladderCanvas.querySelectorAll(".binding-grid-label").forEach(label => {
    if (!activeIds.has(String(label.dataset.labelFor || ""))) label.remove();
  });
}

let bindingLabelSyncPending = false;
function requestBindingGridLabelSync() {
  if (bindingLabelSyncPending) return;
  bindingLabelSyncPending = true;
  requestAnimationFrame(() => {
    bindingLabelSyncPending = false;
    syncBindingGridLabels();
  });
}

const bindingLabelObserver = new MutationObserver(mutations => {
  if (mutations.every(m => m.target?.classList?.contains("binding-grid-label") || m.target?.closest?.(".binding-grid-label"))) return;
  requestBindingGridLabelSync();
});
bindingLabelObserver.observe(ladderCanvas, {
  subtree:true,
  childList:true,
  attributes:true,
  attributeFilter:["data-properties", "data-major-column", "data-major-row", "data-program-type", "data-block-id"]
});

function refreshBooleanBindingMetadata() {
  const physicalByPoint = new Map(getConfiguredDigitalIOPoints().map(point => [point.logicalPoint, point]));
  const virtualByPoint = new Map(getVirtualCoilDefinitions().map(point => [point.logicalPoint, point]));

  ladderCanvas.querySelectorAll(".placed-tile").forEach(tile => {
    const type = getProgramTypeFromTile(tile);
    if (!["normally_open", "normally_closed", "pgt_contact", "ngt_contact", "coil"].includes(type)) return;
    let properties = {};
    let ports = defaultPortsForType(type);
    try { properties = JSON.parse(tile.dataset.properties || "{}"); } catch (error) {}
    try { ports = JSON.parse(tile.dataset.ports || JSON.stringify(ports)); } catch (error) {}
    const logicalPoint = normalizeLogicalPoint(properties.logicalPoint);
    if (!logicalPoint) return;

    if (isVirtualCoilLogicalPoint(logicalPoint)) {
      if (type !== "coil") {
        const definition = virtualByPoint.get(logicalPoint);
        if (definition) properties.descriptor = definition.descriptor;
      }
    } else {
      const point = physicalByPoint.get(logicalPoint);
      if (point) properties.descriptor = point.descriptor;
    }

    if (["normally_open", "normally_closed", "pgt_contact", "ngt_contact"].includes(type)) {
      setPortBinding(ports, "condition", logicalPoint);
    } else if (type === "coil") {
      setPortBinding(ports, "output", logicalPoint);
    }
    properties.logicalPoint = logicalPoint;
    tile.dataset.properties = JSON.stringify(properties);
    tile.dataset.ports = JSON.stringify(ports);
    updatePlacedTileBindingMetadata(tile, properties);
  });
  requestBindingGridLabelSync();
}

function defaultPortsForType(type) {
  const boolPort = (name, direction) => ({
    name,
    direction,
    dataType: "bool",
    binding: null
  });

  switch (type) {
    case "normally_open":
    case "normally_closed":
    case "pgt_contact":
    case "ngt_contact":
      return [
        boolPort("input", "input"),
        boolPort("condition", "input"),
        boolPort("output", "output")
      ];

    case "horizontal_shunt":
    case "coil":
    case "add":
    case "multiply":
    case "block_move":
    case "analog_in":
    case "analog_out":
    case "pid":
      return [
        boolPort("input", "input"),
        boolPort("output", "output")
      ];

    case "subtract":
      return [
        boolPort("input", "input"),
        boolPort("greaterThan", "output"),
        boolPort("positiveEqual", "output"),
        boolPort("lessThan", "output")
      ];

    case "divide":
      return [
        boolPort("enable", "input"),
        boolPort("remainderSelect", "input"),
        boolPort("success", "output"),
        boolPort("middleStatus", "output"),
        boolPort("mathError", "output")
      ];

    case "vertical_shunt":
      return [
        boolPort("upper", "bidirectional"),
        boolPort("lower", "bidirectional")
      ];

    case "timer":
    case "counter":
      return [
        boolPort("enable", "input"),
        boolPort("reset", "input"),
        boolPort("output", "output"),
        boolPort("notOutput", "output")
      ];

    default:
      return [];
  }
}

function defaultPropertiesForType(type) {
  if (type === "timer") return { presetMs: 1000 };
  if (type === "counter") return { preset: 10 };
  if (type === "add") return { addend1: null, addend2: null, result: null };
  if (type === "subtract") return { minuend: null, subtrahend: null, result: null };
  if (type === "multiply") return { multiplicand: null, multiplier: null, result: null };
  if (type === "divide") return { dividend: null, divisor: null, result: null, remainder: null };
  if (type === "block_move") return { source: null, destination: null, length: 1 };
  if (type === "analog_in") return { adcInput: null, result: null, sampleRateTimer: null };
  if (type === "analog_out") return { pwmOutput: null, source: null, sampleRateTimer: null };
  if (type === "pid") return {
    setpoint: null,
    input: null,
    output: null,
    kp: 1,
    ki: 0,
    kd: 0,
    dt: 0.1,
    openLoop: false,
    manualOutput: 0
  };
  return {};
}

function runtimeFieldsForType(type) {
  switch (type) {
    case "normally_open":
    case "normally_closed":
      return ["input", "condition", "output"];

    case "pgt_contact":
    case "ngt_contact":
      return ["input", "condition", "output", "previousCondition"];

    case "horizontal_shunt":
    case "coil":
    case "add":
    case "multiply":
    case "block_move":
    case "analog_in":
    case "analog_out":
    case "pid":
      return ["input", "output"];

    case "subtract":
      return ["input", "greaterThan", "positiveEqual", "lessThan"];

    case "divide":
      return ["enable", "remainderSelect", "success", "middleStatus", "mathError"];

    case "vertical_shunt":
      return ["upper", "lower", "output"];

    case "timer":
      return ["enable", "reset", "output", "notOutput", "accumulatedMs", "presetMs"];

    case "counter":
      return ["enable", "reset", "output", "notOutput", "accumulated", "preset"];

    default:
      return [];
  }
}

function getProgramTypeFromTile(tile) {
  if (tile.dataset.programType) return tile.dataset.programType;

  const label = tile.dataset.blockType;
  return placeableDefinitions[label]?.programType || null;
}

function getVerticalShuntVariant(tile) {
  if (tile.dataset.variant) return tile.dataset.variant;
  const source = tile.getAttribute("src") || "";
  return source.includes("vertical_shunt_right.png") ? "right" : "left";
}

function serializePlacedBlock(tile) {
  const type = getProgramTypeFromTile(tile);
  if (!type) return null;

  const blockId = parseInt(tile.dataset.blockId, 10);
  const row = parseInt(tile.dataset.majorRow || "0", 10);
  const col = parseInt(tile.dataset.majorColumn || "0", 10);
  const spanRows = parseInt(tile.dataset.spanRows || "1", 10);
  const overlay = tile.dataset.overlay === "true";

  let properties = defaultPropertiesForType(type);
  if (tile.dataset.properties) {
    try {
      properties = JSON.parse(tile.dataset.properties);
    } catch (error) {
      console.warn("Invalid stored block properties; using defaults.", error);
    }
  }

  let ports = defaultPortsForType(type);
  if (tile.dataset.ports) {
    try {
      ports = JSON.parse(tile.dataset.ports);
    } catch (error) {
      console.warn("Invalid stored block ports; using defaults.", error);
    }
  }

  return {
    id: blockId,
    type,
    position: { row, col },
    geometry: {
      spanRows,
      spanCols: 1,
      overlay,
      occupiesCell: !overlay,
      variant: type === "vertical_shunt" ? getVerticalShuntVariant(tile) : null
    },
    ports,
    properties,
    runtime: {
      stateFields: runtimeFieldsForType(type)
    }
  };
}

function buildProgramObject() {
  refreshBooleanBindingMetadata();
  const blocks = [...ladderCanvas.querySelectorAll(".placed-tile")]
    .map(serializePlacedBlock)
    .filter(Boolean)
    .sort((a, b) => a.id - b.id);

  const target = getConfigurationForProgram();
  const now = new Date().toISOString();

  return {
    format: "PICO_PLC_LADDER",
    formatVersion: 1,
    program: {
      name: currentProgramName,
      revision: currentProgramRevision,
      description: "",
      createdUtc: null,
      modifiedUtc: now
    },
    target,
    editor: {
      grid: {
        majorCellPx: 140,
        minorCellPx: 28,
        columns: 9
      },
      rows: majorRows
    },
    dataTables: {
      booleanIO: [],
      numeric: []
    },
    blocks
  };
}

function validateProgramForOpen(program) {
  if (!program || typeof program !== "object") {
    throw new Error("The selected file does not contain a ladder program.");
  }
  if (program.format !== "PICO_PLC_LADDER") {
    throw new Error("Unsupported file format.");
  }
  if (program.formatVersion !== 1) {
    throw new Error("Unsupported ladder program version.");
  }
  if (!program.editor || !Number.isInteger(program.editor.rows) || program.editor.rows < 1) {
    throw new Error("The program does not contain a valid editor row count.");
  }
  if (!Array.isArray(program.blocks)) {
    throw new Error("The program does not contain a valid blocks array.");
  }

  const seenIds = new Set();
  for (const block of program.blocks) {
    if (!Number.isInteger(block.id) || block.id < 1 || seenIds.has(block.id)) {
      throw new Error("Every block must have a unique positive integer id.");
    }
    seenIds.add(block.id);

    if (!block.position ||
        !Number.isInteger(block.position.row) ||
        !Number.isInteger(block.position.col) ||
        block.position.col < 0 ||
        block.position.col > 8 ||
        block.position.row < 0) {
      throw new Error(`Block ${block.id} has an invalid position.`);
    }

    if (!programTypeToLabel[block.type]) {
      throw new Error(`Block ${block.id} uses unsupported type "${block.type}".`);
    }
  }
}

function clearPlacedBlocks() {
  ladderCanvas.querySelectorAll(".placed-tile").forEach(tile => tile.remove());
}

function createPlacedTileFromProgramBlock(block) {
  const label = programTypeToLabel[block.type];
  const definition = getDefinitionByProgramType(block.type);

  // v1 can preserve unsupported/deferred Math/Special blocks in JSON, but
  // this editor build can only render block types whose placement definitions exist.
  if (!label || !definition) {
    console.warn(`Block type "${block.type}" is defined by the program format but is not yet renderable.`);
    return;
  }

  const row = block.position.row;
  const col = block.position.col;
  const spanRows = block.geometry?.spanRows || definition.spanRows || 1;
  const overlay = block.geometry?.overlay === true;

  const image = document.createElement("img");
  image.alt = label;
  image.className = "placed-tile";
  image.dataset.blockId = String(block.id);
  image.dataset.programType = block.type;
  image.dataset.blockType = label;
  image.dataset.majorColumn = String(col);
  image.dataset.majorRow = String(row);
  image.dataset.spanRows = String(spanRows);
  image.dataset.overlay = overlay ? "true" : "false";
  if (block.type === "vertical_shunt") {
    image.classList.add("vertical-shunt");
  }
  image.dataset.properties = JSON.stringify(block.properties || {});
  image.dataset.ports = JSON.stringify(block.ports || defaultPortsForType(block.type));

  image.style.left = (col * majorCellSize) + "px";
  image.style.top = (row * majorCellSize + definition.topOffset) + "px";

  if (block.type === "vertical_shunt") {
    const variant = block.geometry?.variant === "right" ? "right" : "left";
    image.dataset.variant = variant;
    image.src = resolveImage(
      variant === "right"
        ? "./images/vertical_shunt_right.png"
        : "./images/vertical_shunt_left.png"
    );
  } else {
    image.src = resolveImage(definition.image);
  }

  if (overlay) image.style.zIndex = "1000";
  updatePlacedTileBindingMetadata(image, block.properties || {});
  ladderCanvas.appendChild(image);
  requestBindingGridLabelSync();
}

function loadProgramIntoEditor(program) {
  // v1.43 authoritative source files wrap the exact ladder/editor source and canonical configuration.
  if (program?.format === "PICO_PLC_PROJECT") {
    if (program.formatVersion !== 1 || !program.ladder) throw new Error("Unsupported PLC project source format.");
    if (program.configuration && typeof program.configuration === "object") {
      localStorage.setItem("picoPLCConfiguration", JSON.stringify(program.configuration));
    }
    currentProgramName = program.project?.title || program.ladder?.program?.name || "Untitled";
    currentProgramRevision = Number.isInteger(program.project?.revision) ? program.project.revision : 1;
    program = program.ladder;
  }
  validateProgramForOpen(program);

  cancelPlacementMode();
  deleteMode = false;
  deleteObjectMode.checked = false;
  clearPlacedBlocks();

  majorRows = Math.max(1, program.editor.rows);
  updateCanvasHeight();

  const sortedBlocks = [...program.blocks].sort((a, b) => a.id - b.id);
  sortedBlocks.forEach(createPlacedTileFromProgramBlock);
  bringVerticalShuntsToFront();
  refreshBooleanBindingMetadata();

  nextBlockId = sortedBlocks.reduce((maxId, block) => Math.max(maxId, block.id), 0) + 1;
  currentProgramName = program.program?.name || "Untitled";
  currentProgramRevision = Number.isInteger(program.program?.revision)
    ? program.program.revision
    : currentProgramRevision || 1;
  syncProjectIdentityUi();

  hideCellHighlight();
}

function jsonTextForCurrentProgram() {
  return JSON.stringify(buildAuthoritativeVerboseProject(), null, 2) + "\n";
}

// v1.33 optimizer ---------------------------------------------------------
// Converts editor geometry into a compact, output-first expression stream.
// Internal/compiler opcodes: 48 AND, 49 OR, 50 NOT.
const optimizerOpcodes = {
  normally_open: 0,
  normally_closed: 1,
  horizontal_shunt: 2,
  vertical_shunt: 3,
  pgt_contact: 4,
  ngt_contact: 5,
  coil: 6,
  timer: 7,
  counter: 8,
  add: 16,
  subtract: 17,
  multiply: 18,
  divide: 19,
  block_move: 32,
  analog_in: 33,
  analog_out: 34,
  pid: 35,
  and: 48,
  or: 49,
  not: 50
};

function optimizerPortBinding(block, portName) {
  return (block.ports || []).find(port => port.name === portName)?.binding ?? null;
}

function optimizerTrue() {
  return { kind: "true" };
}

function optimizerExprKey(expr) {
  if (!expr) return "null";
  switch (expr.kind) {
    case "true": return "T";
    case "false": return "F0";
    case "block": return `B:${expr.opcode}:${expr.id}:${JSON.stringify(expr.binding)}`;
    case "not": return `N:${expr.sourceId}:${JSON.stringify(expr.binding)}`;
    case "function": return `F:${expr.opcode}:${expr.id}:${JSON.stringify(expr.params)}:[${expr.inputs.map(optimizerExprKey).join("|")}]`;
    case "and":
    case "or":
      return `${expr.kind === "and" ? "A" : "O"}:${expr.sourceId || 0}:[${expr.operands.map(optimizerExprKey).join("|")}]`;
    default: return JSON.stringify(expr);
  }
}

function optimizerAnd(left, right) {
  if (!left || !right) return null;
  if (left.kind === "true") return right;
  if (right.kind === "true") return left;

  // AND is emitted in ladder order, but nested serial groups are flattened so
  // one straight series path becomes a single n-operand AND record.
  const operands = [];
  const append = expr => {
    if (expr.kind === "and" && (expr.sourceId || 0) === 0) operands.push(...expr.operands);
    else operands.push(expr);
  };
  append(left);
  append(right);
  return operands.length === 1 ? operands[0] : { kind: "and", sourceId: 0, operands };
}

function optimizerOr(operands, sourceId = 0) {
  let valid = operands.filter(Boolean);
  if (!valid.length) return null;
  if (valid.length === 1) return valid[0];

  // Canonicalize branch joins by factoring any identical leading serial
  // expression shared by every branch. This turns:
  //   (A AND B) OR (A AND C)
  // into:
  //   A AND (B OR C)
  // which matches the physical ladder interpretation when A is upstream of
  // the branch split. Only common *leading* operands are factored, preserving
  // ladder evaluation order for transition/stateful contacts.
  const branchOperands = valid.map(expr =>
    expr.kind === "and" && (expr.sourceId || 0) === 0 ? [...expr.operands] : [expr]
  );

  const common = [];
  while (branchOperands.every(list => list.length > 0)) {
    const key = optimizerExprKey(branchOperands[0][0]);
    if (!branchOperands.every(list => optimizerExprKey(list[0]) === key)) break;
    common.push(branchOperands[0][0]);
    branchOperands.forEach(list => list.shift());
  }

  const rebuildAnd = list => {
    if (!list.length) return optimizerTrue();
    if (list.length === 1) return list[0];
    return { kind: "and", sourceId: 0, operands: list };
  };

  if (common.length) {
    const residuals = branchOperands.map(rebuildAnd);
    let joined;
    if (residuals.some(expr => expr.kind === "true")) {
      joined = optimizerTrue();
    } else {
      joined = { kind: "or", sourceId, operands: residuals };
    }

    let result = rebuildAnd(common);
    if (joined.kind !== "true") result = optimizerAnd(result, joined);
    return result;
  }

  // Flatten nested ORs only when they are compiler-generated; editor shunt IDs
  // are retained as diagnostic boundaries.
  const flattened = [];
  for (const expr of valid) {
    if (expr.kind === "or" && (expr.sourceId || 0) === 0) flattened.push(...expr.operands);
    else flattened.push(expr);
  }
  return { kind: "or", sourceId, operands: flattened };
}

function optimizerContactExpression(block) {
  const binding = optimizerPortBinding(block, "condition");

  // N.C. is reduced to the compiler-internal NOT operation. PGT and NGT are
  // deliberately preserved as stateful runtime leaf opcodes because their
  // one-scan pulse depends on the previous scan state.
  switch (block.type) {
    case "normally_closed":
      return { kind: "not", sourceId: block.id, binding };

    case "normally_open":
      return { kind: "block", opcode: optimizerOpcodes.normally_open, id: block.id, binding };

    case "pgt_contact":
      return { kind: "block", opcode: optimizerOpcodes.pgt_contact, id: block.id, binding };

    case "ngt_contact":
      return { kind: "block", opcode: optimizerOpcodes.ngt_contact, id: block.id, binding };

    default:
      throw new Error(`Unsupported contact type in optimizer: ${block.type}`);
  }
}

function buildOptimizedProgram(program = buildProgramObject()) {
  const blocks = [...program.blocks];

  const physicalIO = getConfiguredDigitalIOPoints();
  const physicalByPoint = new Map(physicalIO.map(point => [point.logicalPoint, point]));
  const virtualCoils = blocks
    .filter(block => block.type === "coil" && isVirtualCoilLogicalPoint(block.properties?.logicalPoint))
    .map(block => ({
      logicalPoint: normalizeLogicalPoint(block.properties.logicalPoint),
      descriptor: String(block.properties?.descriptor || "").trim(),
      blockId: block.id
    }))
    .sort((a, b) => logicalPointNumber(a.logicalPoint).number - logicalPointNumber(b.logicalPoint).number);
  const virtualByPoint = new Map(virtualCoils.map(item => [item.logicalPoint, item]));

  for (const block of blocks) {
    if (!["normally_open", "normally_closed", "pgt_contact", "ngt_contact", "coil"].includes(block.type)) continue;
    const portName = block.type === "coil" ? "output" : "condition";
    const binding = normalizeLogicalPoint(optimizerPortBinding(block, portName));
    if (!binding) continue; // Preserve compatibility with older unbound ladder files.

    if (isVirtualCoilLogicalPoint(binding)) {
      if (!virtualByPoint.has(binding)) {
        throw new Error(`Block ${block.id} references virtual coil ${binding}, but no defining virtual coil exists in the ladder.`);
      }
    } else if (!physicalByPoint.has(binding)) {
      throw new Error(`Block ${block.id} references ${binding}, which is not an active point in the Digital I/O configuration.`);
    }

    if (block.type === "coil") {
      const parsed = logicalPointNumber(binding);
      if (parsed.type !== "O") throw new Error(`Coil ${block.id} must be bound to an O: logical point.`);
    }
  }
  const maxRows = Math.max(program.editor?.rows || 1, ...blocks.map(b => b.position.row + (b.geometry?.spanRows || 1)));
  const columns = program.editor?.grid?.columns || 9;

  const ordinaryByCell = new Map();
  const functionBlocks = [];
  const verticalShuntsByColumn = new Map();

  const cellKey = (row, col) => `${row}:${col}`;

  for (const block of blocks) {
    if (block.type === "vertical_shunt") {
      const list = verticalShuntsByColumn.get(block.position.col) || [];
      list.push(block);
      verticalShuntsByColumn.set(block.position.col, list);
      continue;
    }

    if (["timer", "counter", "add", "subtract", "multiply", "divide", "block_move", "analog_in", "analog_out", "pid"].includes(block.type)) {
      functionBlocks.push(block);
      ordinaryByCell.set(cellKey(block.position.row, block.position.col), block);
      continue;
    }

    ordinaryByCell.set(cellKey(block.position.row, block.position.col), block);
  }

  // Expression available at each row of the current boundary. Boundary 0 is
  // the left power rail. A row does not advance unless a block/shunt provides a path.
  let boundary = Array.from({ length: maxRows }, () => optimizerTrue());
  const boundaries = [boundary.slice()];

  for (let col = 0; col < columns; col++) {
    const rawNext = Array(maxRows).fill(null);

    for (let row = 0; row < maxRows; row++) {
      let block = ordinaryByCell.get(cellKey(row, col));
      let outputSelector = 0;

      // Multi-row function blocks can expose Boolean outputs on more than
      // one major row. Timer/Counter use upper=normal, lower=complementary;
      // SUB and DIV expose three output rows. ADD/MULT only expose the upper row.
      if (!block) {
        const spanning = functionBlocks.find(fn => {
          if (fn.position.col !== col) return false;
          const relativeRow = row - fn.position.row;
          if (relativeRow <= 0) return false;
          if (fn.type === "timer" || fn.type === "counter") return relativeRow === 1;
          if (fn.type === "subtract" || fn.type === "divide") return relativeRow === 1 || relativeRow === 2;
          return false;
        });
        if (spanning) {
          block = spanning;
          outputSelector = row - spanning.position.row;
        }
      }

      if (!block) continue;

      const prior = boundary[row];

      switch (block.type) {
        case "normally_open":
        case "pgt_contact":
        case "ngt_contact":
          rawNext[row] = prior ? optimizerAnd(prior, optimizerContactExpression(block)) : null;
          break;

        case "normally_closed":
          rawNext[row] = prior ? optimizerAnd(prior, optimizerContactExpression(block)) : null;
          break;

        case "horizontal_shunt":
          rawNext[row] = prior;
          break;

        case "timer": {
          const top = block.position.row;
          const enableExpr = boundary[top];
          const resetExpr = boundary[top + 1];
          if (!enableExpr || !resetExpr) break;
          const presetMs = block.properties?.presetMs ?? 0;
          rawNext[row] = {
            kind: "function",
            opcode: optimizerOpcodes.timer,
            id: block.id,
            params: [Math.round(Number(presetMs) * 1000), 2, outputSelector],
            inputs: [enableExpr, resetExpr]
          };
          break;
        }

        case "counter": {
          const top = block.position.row;
          const enableExpr = boundary[top];
          const resetExpr = boundary[top + 1];
          if (!enableExpr || !resetExpr) break;
          const preset = block.properties?.preset ?? 0;
          const flags = block.properties?.direction ?? null;
          rawNext[row] = {
            kind: "function",
            opcode: optimizerOpcodes.counter,
            id: block.id,
            params: [preset, flags, 2, outputSelector],
            inputs: [enableExpr, resetExpr]
          };
          break;
        }

        case "add": {
          // ADD executes continuously while its single upper Boolean input is
          // TRUE and mirrors that Boolean state to its single upper output.
          if (outputSelector !== 0 || !prior) break;
          rawNext[row] = {
            kind: "function",
            opcode: optimizerOpcodes.add,
            id: block.id,
            params: [
              block.properties?.addend1 ?? null,
              block.properties?.addend2 ?? null,
              block.properties?.result ?? null
            ],
            inputs: [prior]
          };
          break;
        }

        case "multiply": {
          // MULT has the same Boolean rung structure as ADD.
          if (outputSelector !== 0 || !prior) break;
          rawNext[row] = {
            kind: "function",
            opcode: optimizerOpcodes.multiply,
            id: block.id,
            params: [
              block.properties?.multiplicand ?? null,
              block.properties?.multiplier ?? null,
              block.properties?.result ?? null
            ],
            inputs: [prior]
          };
          break;
        }

        case "subtract": {
          // SUB has one upper Boolean input and three Boolean outputs:
          // 0 => Greater Than (>), 1 => Positive/Equal (+), 2 => Less Than (<).
          const enableExpr = boundary[block.position.row];
          if (!enableExpr) break;
          rawNext[row] = {
            kind: "function",
            opcode: optimizerOpcodes.subtract,
            id: block.id,
            params: [
              block.properties?.minuend ?? null,
              block.properties?.subtrahend ?? null,
              block.properties?.result ?? null,
              outputSelector
            ],
            inputs: [enableExpr]
          };
          break;
        }

        case "divide": {
          // DIV has two Boolean inputs: upper enable and middle remainder-select.
          // It has three output rows: success, middle status, and math error.
          const top = block.position.row;
          const enableExpr = boundary[top];
          const remainderExpr = boundary[top + 1] || { kind: "false" };
          if (!enableExpr) break;
          rawNext[row] = {
            kind: "function",
            opcode: optimizerOpcodes.divide,
            id: block.id,
            params: [
              block.properties?.dividend ?? null,
              block.properties?.divisor ?? null,
              block.properties?.result ?? null,
              block.properties?.remainder ?? null,
              outputSelector
            ],
            inputs: [enableExpr, remainderExpr]
          };
          break;
        }

        case "block_move": {
          // Block Move executes continuously while rung power is TRUE and
          // mirrors that Boolean state to its output. Source/destination are
          // the first registers in the range; length defaults to one.
          if (outputSelector !== 0 || !prior) break;
          const length = Math.max(1, Math.trunc(Number(block.properties?.length ?? 1)) || 1);
          rawNext[row] = {
            kind: "function",
            opcode: optimizerOpcodes.block_move,
            id: block.id,
            params: [
              block.properties?.source ?? null,
              block.properties?.destination ?? null,
              length,
              null
            ],
            inputs: [prior]
          };
          break;
        }

        case "analog_in": {
          // Analog In has one Boolean enable/pass-through rung. ADC hardware,
          // destination register and sampling timer are internal parameters.
          if (outputSelector !== 0 || !prior) break;
          rawNext[row] = {
            kind: "function",
            opcode: optimizerOpcodes.analog_in,
            id: block.id,
            params: [
              block.properties?.adcInput ?? null,
              block.properties?.result ?? null,
              block.properties?.sampleRateTimer ?? null
            ],
            inputs: [prior]
          };
          break;
        }

        case "analog_out": {
          // Analog Out has one Boolean enable/pass-through rung. PWM hardware,
          // source register and sampling timer are internal parameters.
          if (outputSelector !== 0 || !prior) break;
          rawNext[row] = {
            kind: "function",
            opcode: optimizerOpcodes.analog_out,
            id: block.id,
            params: [
              block.properties?.pwmOutput ?? null,
              block.properties?.source ?? null,
              block.properties?.sampleRateTimer ?? null
            ],
            inputs: [prior]
          };
          break;
        }

        case "pid": {
          // PID is currently provisional. It is serialized as a continuous
          // one-input/one-output Special block. Numeric/process parameters are
          // internal to the block; Boolean rung power passes through unchanged.
          if (outputSelector !== 0 || !prior) break;
          const dtMs = Math.max(0, Math.round(Number(block.properties?.dt ?? 0) * 1000));
          const flags = block.properties?.openLoop ? 1 : 0;
          rawNext[row] = {
            kind: "function",
            opcode: optimizerOpcodes.pid,
            id: block.id,
            params: [
              block.properties?.setpoint ?? null,
              block.properties?.input ?? null,
              block.properties?.output ?? null,
              block.properties?.kp ?? 1,
              block.properties?.ki ?? 0,
              block.properties?.kd ?? 0,
              dtMs,
              flags,
              block.properties?.manualOutput ?? 0
            ],
            inputs: [prior]
          };
          break;
        }

        // Coils are rung terminals, not pass-through edges.
        case "coil":
          break;

        default:
          throw new Error(`Optimization rules are not yet defined for ${block.type}.`);
      }
    }

    // Vertical shunts at column C electrically join the boundary after cell C.
    // Collapse each connected row span to one OR-resolved expression.
    const shunts = verticalShuntsByColumn.get(col) || [];
    if (shunts.length) {
      const parent = Array.from({ length: maxRows }, (_, i) => i);
      const find = x => parent[x] === x ? x : (parent[x] = find(parent[x]));
      const unite = (a, b) => {
        a = find(a); b = find(b);
        if (a !== b) parent[b] = a;
      };

      for (const shunt of shunts) {
        const start = shunt.position.row;
        const span = shunt.geometry?.spanRows || 2;
        for (let r = start; r < Math.min(maxRows - 1, start + span - 1); r++) {
          unite(r, r + 1);
        }
      }

      const groups = new Map();
      for (let row = 0; row < maxRows; row++) {
        const root = find(row);
        const members = groups.get(root) || [];
        members.push(row);
        groups.set(root, members);
      }

      for (const members of groups.values()) {
        if (members.length < 2) continue;
        const sources = members.map(r => rawNext[r]).filter(Boolean);
        if (!sources.length) continue;
        const sourceShunt = shunts.find(shunt => {
          const start = shunt.position.row;
          const end = start + (shunt.geometry?.spanRows || 2) - 1;
          return members.some(r => r >= start && r <= end);
        });
        const joined = optimizerOr(sources, sourceShunt?.id || 0);
        members.forEach(r => { rawNext[r] = joined; });
      }
    }

    boundary = rawNext;
    boundaries.push(boundary.slice());
  }

  function optimizerCanUseImplicitSeries(expr) {
    // A plain coil rung made only from serial contact conditions does not need
    // an explicit AND opcode. Sequential evaluation already means logical AND.
    // Keep AND explicit whenever grouping is required (OR/function/nested logic)
    // so the parser can still reconstruct expression boundaries unambiguously.
    return expr?.kind === "and" &&
      (expr.sourceId || 0) === 0 &&
      expr.operands.length > 1 &&
      expr.operands.every(operand => operand.kind === "block" || operand.kind === "not");
  }

  function serializeExpression(expr, output, allowImplicitSeries = false) {
    if (!expr || expr.kind === "true") return;
    if (expr.kind === "false") {
      output.push(null);
      return;
    }

    if (expr.kind === "block") {
      output.push([expr.opcode, expr.id, expr.binding]);
      return;
    }

    if (expr.kind === "not") {
      output.push([optimizerOpcodes.not, expr.sourceId, expr.binding]);
      return;
    }

    if (expr.kind === "and" || expr.kind === "or") {
      if (allowImplicitSeries && optimizerCanUseImplicitSeries(expr)) {
        expr.operands.forEach(operand => serializeExpression(operand, output, false));
        return;
      }

      output.push([
        expr.kind === "and" ? optimizerOpcodes.and : optimizerOpcodes.or,
        expr.sourceId || 0,
        expr.operands.length
      ]);
      expr.operands.forEach(operand => serializeExpression(operand, output, false));
      return;
    }

    if (expr.kind === "function") {
      output.push([expr.opcode, expr.id, ...expr.params]);
      // Function input expressions must retain explicit grouping so the parser
      // can distinguish one port expression from the next.
      expr.inputs.forEach(input => serializeExpression(input, output, false));
    }
  }

  const rungs = [];
  const terminalEntries = [];
  const coils = blocks
    .filter(block => block.type === "coil")
    .sort((a, b) => a.position.row - b.position.row || a.position.col - b.position.col);

  // Track function blocks already required by an executable terminal so that
  // unused alternate outputs of Timer/Counter/SUB/DIV do not cause duplicate
  // execution records to be emitted as separate rungs.
  function collectFunctionIds(expr, ids = new Set()) {
    if (!expr) return ids;
    if (expr.kind === "function") {
      ids.add(expr.id);
      expr.inputs?.forEach(input => collectFunctionIds(input, ids));
      return ids;
    }
    if (expr.kind === "and" || expr.kind === "or") {
      expr.operands?.forEach(operand => collectFunctionIds(operand, ids));
    }
    return ids;
  }

  const consumedFunctionIds = new Set();
  const coilRows = new Set();

  // First emit conventional coil-terminated executable rungs.
  for (const coil of coils) {
    const inputBoundary = boundaries[coil.position.col];
    const expression = inputBoundary?.[coil.position.row] || null;
    if (!expression || expression.kind === "true") {
      throw new Error(`Coil ${coil.id} does not have a resolvable input path.`);
    }

    const records = [[optimizerOpcodes.coil, coil.id, optimizerPortBinding(coil, "output")]];
    serializeExpression(expression, records, true);
    terminalEntries.push({ row: coil.position.row, col: coil.position.col, records });
    coilRows.add(coil.position.row);
    collectFunctionIds(expression, consumedFunctionIds);
  }

  // A rung does not require a coil to be meaningful. Math, Special, Timer and
  // Counter blocks can themselves be executable terminals. Also preserve an
  // incomplete Basic-only rung in optimized form; because it has no terminal
  // instruction, the Pico parser may safely ignore it when generating
  // solve_logic() runtime code.
  const rowCandidates = [];
  for (let row = 0; row < maxRows; row++) {
    if (coilRows.has(row)) continue;

    let expression = null;
    let boundaryIndex = -1;
    for (let i = boundaries.length - 1; i >= 1; i--) {
      const candidate = boundaries[i]?.[row] || null;
      if (candidate && candidate.kind !== "true") {
        expression = candidate;
        boundaryIndex = i;
        break;
      }
    }

    if (expression) rowCandidates.push({ row, col: boundaryIndex - 1, expression });
  }

  // Prefer the upper/primary output when the same multi-output function block
  // appears as the terminal expression on more than one row.
  const terminalFunctionIds = new Set(consumedFunctionIds);
  for (const candidate of rowCandidates) {
    const expr = candidate.expression;

    if (expr.kind === "function") {
      if (terminalFunctionIds.has(expr.id)) continue;
      const records = [];
      serializeExpression(expr, records, true);
      if (records.length) {
        terminalEntries.push({ row: candidate.row, col: candidate.col, records });
        collectFunctionIds(expr, terminalFunctionIds);
      }
      continue;
    }

    // If this incomplete path contains a function already emitted as part of
    // another executable rung, suppress the duplicate path. Otherwise retain
    // the compressed Basic-only/non-terminal expression for diagnostics and
    // future editing; the runtime parser can ignore it.
    const candidateFunctionIds = collectFunctionIds(expr, new Set());
    if ([...candidateFunctionIds].some(id => terminalFunctionIds.has(id))) continue;

    const records = [];
    serializeExpression(expr, records, true);
    if (records.length) {
      terminalEntries.push({ row: candidate.row, col: candidate.col, records });
      candidateFunctionIds.forEach(id => terminalFunctionIds.add(id));
    }
  }

  // Preserve ladder ordering: top-to-bottom, then left-to-right for terminals
  // that originate on the same major row.
  terminalEntries
    .sort((a, b) => a.row - b.row || a.col - b.col)
    .forEach(entry => rungs.push(entry.records));

  if (!rungs.length && blocks.length) {
    throw new Error("No resolvable ladder logic was found to optimize.");
  }

  // CRC32 of the exact verbose JSON text generated from the current grid.
  const sourceText = JSON.stringify(program, null, 2) + "\n";
  const crcTable = buildOptimizedProgram.crcTable || (buildOptimizedProgram.crcTable = (() => {
    const table = [];
    for (let n = 0; n < 256; n++) {
      let c = n;
      for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      table[n] = c >>> 0;
    }
    return table;
  })());
  let crc = 0xFFFFFFFF;
  const bytes = new TextEncoder().encode(sourceText);
  for (const byte of bytes) crc = crcTable[(crc ^ byte) & 0xFF] ^ (crc >>> 8);
  crc = (crc ^ 0xFFFFFFFF) >>> 0;

  return {
    format: "PICO_PLC_OPTIMIZED",
    v: 1,
    p: [
      projectMeta?.title || program.program?.name || currentProgramName,
      projectMeta?.sourceCRC ?? crc,
      projectMeta?.revision || program.program?.revision || 1
    ],
    cfg: buildOptimizedConfiguration(),
    vc: virtualCoils.map(item => [item.logicalPoint, item.descriptor]),
    r: rungs
  };
}

function updateOptimizeLogicVisibility() {
  const hasLogic = !!ladderCanvas.querySelector(".placed-tile");
  optimizeLogicButton.classList.toggle("hidden", !hasLogic);
}

async function saveOptimizedLogic() {
  try {
    const artifacts = buildTransferArtifacts();
    const optimized = artifacts.optimized;
    const text = artifacts.optimizedText;
    const filename = normalizeJsonFilename(`${currentProgramName}_optimized`);

    if ("showSaveFilePicker" in window) {
      const handle = await window.showSaveFilePicker({
        suggestedName: filename,
        types: [{
          description: "Optimized Pico PLC Logic",
          accept: { "application/json": [".json"] }
        }]
      });
      await saveWithHandle(handle, text);
      return;
    }

    downloadJsonFallback(filename, text);
  } catch (error) {
    if (error?.name !== "AbortError") {
      console.error("Unable to optimize ladder logic:", error);
      alert(`Unable to optimize ladder logic. ${error?.message || ""}`.trim());
    }
  }
}

function normalizeJsonFilename(name) {
  const trimmed = (name || "ladder_program").trim() || "ladder_program";
  return trimmed.toLowerCase().endsWith(".json") ? trimmed : trimmed + ".json";
}

function downloadJsonFallback(filename, text) {
  const blob = new Blob([text], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = normalizeJsonFilename(filename);
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

async function saveWithHandle(handle, text) {
  const writable = await handle.createWritable();
  await writable.write(text);
  await writable.close();
}


function setPlcState(nextState, detail = "") {
  plcState = nextState;
  plcStatus.classList.remove("running", "error", "connecting");
  const leftRail = ladderCanvas.querySelector(".rail.left");
  if (nextState === "RUNNING") {
    plcStatus.classList.add("running");
    plcStatusText.textContent = detail || "Running";
    plcRunStopButton.textContent = "Stop PLC, Flush Program";
    plcRunStopButton.classList.add("stop-mode");
    leftRail?.classList.add("plc-running");
  } else {
    leftRail?.classList.remove("plc-running");
    clearLivePowerVisualization();
    plcRunStopButton.textContent = "Upload Logic, Run PLC";
    plcRunStopButton.classList.remove("stop-mode");
    if (nextState === "READY_FOR_PROGRAM") plcStatusText.textContent = detail || "Offline — Ready for Program";
    else if (nextState === "ERROR") { plcStatus.classList.add("error"); plcStatusText.textContent = detail || "Programming Error"; }
    else if (nextState === "CONNECTING") { plcStatus.classList.add("connecting"); plcStatusText.textContent = detail || "Connecting…"; }
    else if (nextState === "DISCONNECTED") plcStatusText.textContent = detail || "Disconnected";
    else plcStatusText.textContent = detail || nextState;
  }
  plcRunStopButton.disabled = !plcConnected || !["RUNNING", "READY_FOR_PROGRAM"].includes(nextState);
}

function applyLiveSnapshot(snapshot) {
  if (plcState !== "RUNNING") return;
  clearLivePowerVisualization();
  const blocks = snapshot?.blocks || snapshot?.power || {};
  for (const [id, state] of Object.entries(blocks)) {
    const tile = ladderCanvas.querySelector(`.placed-tile[data-block-id="${CSS.escape(String(id))}"]`);
    if (!tile) continue;
    const powerIn = Array.isArray(state) ? !!state[0] : !!state?.powerIn;
    const powerOut = Array.isArray(state) ? !!state[1] : !!state?.powerOut;
    if (powerIn) tile.classList.add("live-power-in");
    if (powerOut) tile.classList.add("live-powered");
  }
}
